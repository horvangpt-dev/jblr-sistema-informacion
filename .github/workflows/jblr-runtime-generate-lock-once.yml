name: JBLR Runtime Generate Lock Once

on:
  push:
    branches:
      - 00e-autonomous-actor-runtime-v1
    paths:
      - '.github/workflows/jblr-runtime-generate-lock-once.yml'

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: 00e-autonomous-actor-runtime-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate dependency lock without lifecycle scripts
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change to commit"
            exit 0
          fi
          git commit -m "build(runtime): lock dependency graph"
          git push origin HEAD:00e-autonomous-actor-runtime-v1
