name: 09 Corpus B productive fresh resolution

on:
  push:
    branches:
      - 09-corpus-b-productive-v1
    paths:
      - 'execution/09/corpus-b-cold-start-v1/run-control/RUN_REQUEST.json'

permissions:
  contents: write

jobs:
  productive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09-corpus-b-productive-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate governed request
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('execution/09/corpus-b-cold-start-v1/run-control/RUN_REQUEST.json','utf8'));
          if(p.releaseEvent!=='JBLR-EVT-0000-20260824-ACCEPT-08-RELEASE-09-CORPUS-B-001') throw new Error('RELEASE_EVENT_MISMATCH');
          if(p.crossWithA!==false) throw new Error('CROSS_WITH_A_MUST_BE_FALSE');
          if(p.neonWrites!==0) throw new Error('NEON_WRITES_MUST_BE_ZERO');
          if(p.cacheInitialState!=='EMPTY') throw new Error('CACHE_MUST_START_EMPTY');
          if(p.sourceSha256!=='f3b2c9ca0921779cf5131ea8d4c98a35299a325cf0be4f419cfec4d39e667f4f') throw new Error('SOURCE_HASH_MISMATCH');
          NODE

      - name: Re-run accepted isolation QA
        working-directory: execution/08/corpus-b-cold-start-v1
        run: node --test test/*.test.js

      - name: Download fresh Spanish vascular checklist
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/spanish-flora" "$RUNNER_TEMP/spanish-flora.zip"
          mkdir -p "$RUNNER_TEMP/spanish-flora"
          curl -fL --retry 3 --retry-delay 2 'https://ipt.gbif.es/archive.do?r=taxonesfloraespanola' -o "$RUNNER_TEMP/spanish-flora.zip"
          unzip -q "$RUNNER_TEMP/spanish-flora.zip" -d "$RUNNER_TEMP/spanish-flora"
          TAXON_FILE="$(find "$RUNNER_TEMP/spanish-flora" -type f \( -name 'taxon.txt' -o -name 'taxa.txt' \) | head -n 1)"
          test -n "$TAXON_FILE"
          echo "TAXON_FILE=$TAXON_FILE" >> "$GITHUB_ENV"
          sha256sum "$RUNNER_TEMP/spanish-flora.zip"
          sha256sum "$TAXON_FILE"

      - name: Execute fresh 338 resolution
        shell: bash
        run: |
          rm -rf execution/09/corpus-b-cold-start-v1/output
          mkdir -p execution/09/corpus-b-cold-start-v1/output
          node execution/09/corpus-b-cold-start-v1/bin/run-fresh-338-resolution.js \
            execution/09/corpus-b-cold-start-v1/input/CORPUS_B_338_QUEUE.json \
            "$TAXON_FILE" \
            execution/09/corpus-b-cold-start-v1/output

      - name: Build observable receipt
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),path=require('path');
          const root='execution/09/corpus-b-cold-start-v1';
          const manifest=JSON.parse(fs.readFileSync(root+'/output/RUN_MANIFEST_PHASE_B.json','utf8'));
          const qa=JSON.parse(fs.readFileSync(root+'/output/QA_REPORT.json','utf8'));
          const files=fs.readdirSync(root+'/output').sort();
          const hashes={};for(const f of files){const b=fs.readFileSync(root+'/output/'+f);hashes[f]=crypto.createHash('sha256').update(b).digest('hex');}
          const receipt={receiptVersion:'CORPUS_B_09_PRODUCTIVE_RECEIPT_v1',githubRunId:String(process.env.GITHUB_RUN_ID),githubRunAttempt:String(process.env.GITHUB_RUN_ATTEMPT||'1'),observedAt:new Date().toISOString(),status:qa.QA_STATE==='PASS'?'PASS':'FAIL',releaseEvent:'JBLR-EVT-0000-20260824-ACCEPT-08-RELEASE-09-CORPUS-B-001',runId:manifest.RUN_ID,counts:manifest.counts,independence:manifest.independence,hashes,CROSS_WITH_A_PERFORMED:false,CROSSWALK_MODULE_EXECUTED:false,NEON_WRITES:0,CANONICAL_CORPUS_A_MUTATION:0,canonicalEffect:'NONE_PENDING_0000_POSTRUN_ACCEPTANCE'};
          fs.mkdirSync(root+'/run-control',{recursive:true});fs.writeFileSync(root+'/run-control/LAST_RESULT.json',JSON.stringify(receipt,null,2)+'\n');
          console.log(JSON.stringify(receipt,null,2));
          NODE

      - name: Publish immutable run evidence to branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add execution/09/corpus-b-cold-start-v1/output execution/09/corpus-b-cold-start-v1/run-control/LAST_RESULT.json
          git commit -m "result(09): Corpus B fresh productive run ${GITHUB_RUN_ID}" || true
          git push origin HEAD:09-corpus-b-productive-v1
