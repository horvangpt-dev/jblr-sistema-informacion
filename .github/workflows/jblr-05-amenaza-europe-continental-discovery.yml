name: JBLR 05 Amenaza Europe Continental 2011 Discovery

on:
  push:
    branches:
      - 05-motores-analiticos-botanicos
    paths:
      - '.github/workflows/jblr-05-amenaza-europe-continental-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download source and extract Appendix 2 layout text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/05/amenaza/europe-continental-2011
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://bibliotecadigital.ipb.pt/bitstreams/0080af51-723a-4c02-9074-da3a1510aa8a/download' \
            -o out/05/amenaza/europe-continental-2011/European_Red_List_Vascular_Plants_2011.pdf
          python -m pip install --quiet 'pdfplumber==0.11.7'
          python - <<'PY'
          from pathlib import Path
          import pdfplumber
          p=Path('out/05/amenaza/europe-continental-2011/European_Red_List_Vascular_Plants_2011.pdf')
          out=Path('out/05/amenaza/europe-continental-2011/appendix2_layout.txt')
          chunks=[]
          with pdfplumber.open(p) as pdf:
              print('PDF_PAGES=', len(pdf.pages))
              for pageno in range(81,124):
                  page=pdf.pages[pageno]
                  txt=page.extract_text(layout=True, x_tolerance=1, y_tolerance=2) or ''
                  chunks.append(f'<<<PDF_PAGE_{pageno+1}>>>\n{txt}\n')
          out.write_text('\n'.join(chunks),encoding='utf-8')
          print('APPENDIX_TEXT_BYTES=',out.stat().st_size)
          PY
          sha256sum out/05/amenaza/europe-continental-2011/European_Red_List_Vascular_Plants_2011.pdf | tee out/05/amenaza/europe-continental-2011/pdf_sha256.txt
          sed -n '1,220p' out/05/amenaza/europe-continental-2011/appendix2_layout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jblr-05-amenaza-europe-continental-2011-discovery
          path: out/05/amenaza/europe-continental-2011/
          if-no-files-found: error
          retention-days: 30
