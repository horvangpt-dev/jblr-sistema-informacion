name: JBLR Runtime QA Attest Once

on:
  push:
    branches:
      - 00e-autonomous-actor-runtime-v1
    paths:
      - '.github/workflows/jblr-runtime-qa-attest-once.yml'

permissions:
  contents: write

jobs:
  attest-locked-runtime-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: 00e-autonomous-actor-runtime-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Syntax check runtime
        run: |
          node -c src/agent-runtime/file-session.js
          node -c src/agent-runtime/actor-registry.js
          node -c src/agent-runtime/runtime-store.js
          node -c src/agent-runtime/continuity.js
          node -c src/agent-runtime/external-state-adapter.js
          node -c src/agent-runtime/github-runtime-adapter.js
          node -c src/agent-runtime/openai-agent-adapter.js
          node -c src/agent-runtime/orchestrator.js
          node -c src/agent-runtime/server.js

      - name: Test autonomous runtime
        run: npm run test:agent-runtime

      - name: Verify locked Agents SDK runtime exports
        run: |
          node - <<'NODE'
          import('@openai/agents').then(sdk => {
            for (const name of ['Agent', 'run', 'OpenAIResponsesCompactionSession']) {
              if (!sdk[name]) throw new Error(`Missing @openai/agents export: ${name}`);
            }
            console.log('Locked Agents SDK exports: PASS');
          }).catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit remote QA attestation
        working-directory: .
        run: |
          mkdir -p evidence/00e_runtime
          {
            echo 'JBLR_AUTONOMOUS_ACTOR_RUNTIME_REMOTE_LOCKED_QA=PASS'
            echo "SOURCE_COMMIT=${GITHUB_SHA}"
            echo "WORKFLOW_RUN_ID=${GITHUB_RUN_ID}"
            echo "WORKFLOW_RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo 'DEPENDENCY_INSTALL=npm_ci_ignore_scripts'
            echo 'LOCKFILE=app/package-lock.json'
            echo 'OPENAI_AGENTS_LOCKED_VERSION=0.16.1'
            echo 'CHECKS=syntax+agent_runtime_core+agent_runtime_integration+agents_sdk_exports'
            echo 'REAL_OPENAI_API_CALL=NOT_RUN'
            echo 'REAL_GOOGLE_SHARED_STATE_CALL=NOT_RUN'
            echo 'INTEGRATION_READY=NO'
          } > evidence/00e_runtime/REMOTE_LOCKED_QA_PASS_20260820.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/00e_runtime/REMOTE_LOCKED_QA_PASS_20260820.txt
          git commit -m "test(runtime): attest locked remote QA pass"
          git push origin HEAD:00e-autonomous-actor-runtime-v1
