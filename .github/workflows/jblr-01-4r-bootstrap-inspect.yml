name: JBLR 01.4R Baseline Transport Verify
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-baseline-transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current immutable baseline parts
        shell: bash
        run: |
          set -euo pipefail
          cat db/baseline/parts/*.sqlpart > /tmp/current-prefix.sql
          bytes=$(wc -c </tmp/current-prefix.sql)
          hash=$(sha256sum /tmp/current-prefix.sql | awk '{print $1}')
          echo "transport_bytes=$bytes"
          echo "transport_sha256=$hash"
          test "$bytes" = "51545"
          test "$hash" = "6ce2980a50c17f29896cd66e015e596f4aad758ea4518dbaeb23e792762c3aa3"
          echo 'BASELINE_PREFIX_MATCH=PASS'
