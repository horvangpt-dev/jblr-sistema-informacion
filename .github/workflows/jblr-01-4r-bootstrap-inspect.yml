name: JBLR 01.4R Bootstrap Inspect
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  inspect-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect and reconstruct segmented bootstrap
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/bootstrap.gz
          for f in .bootstrap_01_4r/part_*; do
            clean="/tmp/$(basename "$f").b64"
            tr -d '\r\n' < "$f" > "$clean"
            n=$(wc -c < "$clean")
            printf '%s chars=%s mod4=%s tail=' "$f" "$n" "$((n%4))"
            tail -c 12 "$clean"; echo
            if grep -q '[^A-Za-z0-9+/=]' "$clean"; then
              echo "INVALID_CHARACTERS in $f"; exit 10
            fi
            if base64 -d "$clean" >> /tmp/bootstrap.gz 2>/tmp/decode.err; then
              echo "decoded $f independently"
            else
              echo "independent decode failed for $f"
              cat /tmp/decode.err
              exit 11
            fi
          done
          echo "reconstructed_bytes=$(wc -c </tmp/bootstrap.gz)"
          sha256sum /tmp/bootstrap.gz
          file /tmp/bootstrap.gz
          gzip -t /tmp/bootstrap.gz
          gzip -dc /tmp/bootstrap.gz > /tmp/bootstrap.payload
          sha256sum /tmp/bootstrap.payload
          file /tmp/bootstrap.payload
          if tar -tf /tmp/bootstrap.payload >/tmp/tar-list.txt 2>/tmp/tar-error.txt; then
            echo 'PAYLOAD_IS_TAR=yes'
            sed -n '1,160p' /tmp/tar-list.txt
          else
            echo 'PAYLOAD_IS_TAR=no'
            cat /tmp/tar-error.txt
            echo 'payload_head:'
            head -c 256 /tmp/bootstrap.payload | xxd
          fi
