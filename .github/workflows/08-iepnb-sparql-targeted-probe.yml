name: JBLR 08 IEPNB SPARQL Targeted Probe

on:
  workflow_dispatch:
  push:
    branches:
      - 08-stime-execution-v1
    paths:
      - 'execution/08/miteco-rioja-expansion-v1/run-control/SPARQL_TARGETED_REQUEST.json'

permissions:
  contents: write

env:
  ROOT: execution/08/miteco-rioja-expansion-v1

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 08-stime-execution-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe exact EIDOS taxon relations
        run: node "$ROOT/bin/probe-iepnb-sparql-targeted.js" "$ROOT/run-control/SPARQL_TARGETED_RESULT.json"
      - name: Publish result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ROOT/run-control/SPARQL_TARGETED_RESULT.json"
          git commit -m "probe(08): record targeted IEPNB SPARQL result ${GITHUB_RUN_ID}" || true
          git push origin HEAD:08-stime-execution-v1
