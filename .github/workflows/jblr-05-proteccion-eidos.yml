name: JBLR 05 Proteccion Legal EIDOS

on:
  workflow_run:
    workflows: ["JBLR 05 Amenaza EIDOS Full Evidence"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  proteccion-eidos:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 05-motores-analiticos-botanicos
      - name: Download cached Objective 01 EIDOS artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input/eidos
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID='${{ github.event.workflow_run.id }}'
          else
            RUN_ID=$(gh run list --workflow jblr-05-amenaza-eidos-full.yml --branch 05-motores-analiticos-botanicos --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          test -n "$RUN_ID"
          gh run download "$RUN_ID" -n jblr-05-amenaza-eidos-full -D input/eidos
          test -s input/eidos/taxon_reconciliation.csv
          test -s input/eidos/taxon_summary.csv
          test "$(($(wc -l < input/eidos/taxon_reconciliation.csv)-1))" -eq 2742
      - name: Syntax check
        run: python -m py_compile ops/05/proteccion_eidos_from_reconciliation.py
      - name: Acquire legal-protection evidence from cached accepted IDs
        run: |
          python ops/05/proteccion_eidos_from_reconciliation.py \
            --reconciliation input/eidos/taxon_reconciliation.csv \
            --summary input/eidos/taxon_summary.csv \
            --out out/05/proteccion/eidos
      - name: Verify evidence/source separation
        shell: bash
        run: |
          set -euo pipefail
          test "$(($(wc -l < out/05/proteccion/eidos/taxon_summary.csv)-1))" -eq 2742
          python - <<'PY'
          import json
          m=json.load(open('out/05/proteccion/eidos/run_manifest.json',encoding='utf-8'))
          assert m['taxon_universe']==2742
          assert m['taxon_name_requeries']==0
          assert m['scoring_performed'] is False
          assert m['query_provenance_rows'] >= m['unique_accepted_taxon_ids_queried']
          print(json.dumps(m,ensure_ascii=False,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jblr-05-proteccion-eidos
          path: out/05/proteccion/eidos/
          if-no-files-found: error
          retention-days: 30
