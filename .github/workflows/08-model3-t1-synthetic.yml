name: 08 Model3 T1 synthetic

on:
  push:
    branches:
      - 08-model3-t1-synthetic-v1
    paths:
      - experimental/08/model3_t1_synthetic_v1/**
      - .github/workflows/08-model3-t1-synthetic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-t1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute corrective T1 and regenerate artifacts
        run: |
          cd experimental/08/model3_t1_synthetic_v1
          python prototype.py --write-results
      - name: Verify committed artifacts are current
        run: |
          git diff --exit-code -- \
            experimental/08/model3_t1_synthetic_v1/RUN_MANIFEST.json \
            experimental/08/model3_t1_synthetic_v1/FIXTURE_RESULTS.json \
            experimental/08/model3_t1_synthetic_v1/T1_RESULT.json \
            experimental/08/model3_t1_synthetic_v1/SYNTHETIC_UNIVERSE.json
          test -z "$(git status --porcelain -- experimental/08/model3_t1_synthetic_v1/RUN_MANIFEST.json experimental/08/model3_t1_synthetic_v1/FIXTURE_RESULTS.json experimental/08/model3_t1_synthetic_v1/T1_RESULT.json experimental/08/model3_t1_synthetic_v1/SYNTHETIC_UNIVERSE.json)"
