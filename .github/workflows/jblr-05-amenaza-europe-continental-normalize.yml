name: JBLR 05 Amenaza Europe Continental 2011 Normalize

on:
  push:
    branches:
      - 05-motores-analiticos-botanicos
    paths:
      - '.github/workflows/jblr-05-amenaza-europe-continental-normalize.yml'
      - 'ops/05/amenaza_europe_continental_2011.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct canonical universe
        run: |
          set -euo pipefail
          python ops/05/reconstruct_taxon_universe.py
          echo '3a0f9badf84a6798d01f0b5f3c01d72875d28f852db0b2ec49592bccfb2f31e4  data/05/taxon_universe.csv' | sha256sum -c -
      - name: Reuse cached verified source publication artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p cache/eucont out/05/amenaza/europe-continental-2011
          gh run download 32036803768 -n jblr-05-amenaza-europe-continental-2011-discovery -D cache/eucont-discovery
          cp cache/eucont-discovery/European_Red_List_Vascular_Plants_2011.pdf cache/eucont/European_Red_List_Vascular_Plants_2011.pdf
          test -s cache/eucont/European_Red_List_Vascular_Plants_2011.pdf
          sha256sum cache/eucont/European_Red_List_Vascular_Plants_2011.pdf > out/05/amenaza/europe-continental-2011/source_pdf_sha256.txt
      - name: Normalize Appendix 2
        run: |
          set -euo pipefail
          python -m pip install --quiet 'pypdf==6.0.0'
          python ops/05/amenaza_europe_continental_2011.py \
            --pdf cache/eucont/European_Red_List_Vascular_Plants_2011.pdf \
            --universe data/05/taxon_universe.csv \
            --out out/05/amenaza/europe-continental-2011
      - name: Evidence-only QA
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          from pathlib import Path
          d=Path('out/05/amenaza/europe-continental-2011')
          m=json.loads((d/'run_manifest.json').read_text())
          assert m['source_records']==1826
          assert m['scoring_performed'] is False
          assert m['absence_inference_performed'] is False
          rows=list(csv.DictReader((d/'taxon_summary.csv').open(encoding='utf-8-sig')))
          assert len(rows)==2742
          ev=list(csv.DictReader((d/'evidence_records.csv').open(encoding='utf-8-sig')))
          assert all(r['territorial_scope'] in ('Europe','EU27') for r in ev)
          assert all(r['category'] for r in ev)
          assert all(r['scoring_performed']=='NO' for r in ev)
          print('EUROPE_CONTINENTAL_2011_QA=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: jblr-05-amenaza-europe-continental-2011
          path: out/05/amenaza/europe-continental-2011/
          if-no-files-found: error
          retention-days: 30
