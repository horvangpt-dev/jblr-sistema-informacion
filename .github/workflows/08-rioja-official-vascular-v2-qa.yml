name: 08 Rioja Official Vascular v2 QA
on:
  push:
    branches: [08-stime-execution-v1]
    paths:
      - 'execution/08/miteco-rioja-expansion-v1/src/rioja-official-vascular-resolution-v2.js'
      - 'execution/08/miteco-rioja-expansion-v1/tests/rioja-official-vascular-resolution-v2.test.js'
      - '.github/workflows/08-rioja-official-vascular-v2-qa.yml'
  pull_request:
    paths:
      - 'execution/08/miteco-rioja-expansion-v1/src/rioja-official-vascular-resolution-v2.js'
      - 'execution/08/miteco-rioja-expansion-v1/tests/rioja-official-vascular-resolution-v2.test.js'
      - '.github/workflows/08-rioja-official-vascular-v2-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run controlled 08 v2 QA
        run: node execution/08/miteco-rioja-expansion-v1/tests/rioja-official-vascular-resolution-v2.test.js
