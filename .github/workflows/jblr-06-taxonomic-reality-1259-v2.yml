name: JBLR TAXONOMIC REALITY 1259 THREE SOURCES V2

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 06-stimes-banco-semillas
    paths:
      - 'app/data/stimes/amenaza/taxonomic-reality-1259-trigger.txt'

permissions:
  contents: write

concurrency:
  group: jblr-taxonomic-reality-1259-v2
  cancel-in-progress: false

jobs:
  taxonomic-reality-1259-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TAXON_REALITY_OUT: artifacts/taxonomic_reality_1259
      TAXON_HTTP_WAIT: '0.45'
    steps:
      - name: Checkout canonical actor branch
        uses: actions/checkout@v4
        with:
          ref: 06-stimes-banco-semillas

      - name: Install protocol dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests beautifulsoup4

      - name: Preflight POWO WFO and official ANTHOS RJB-CSIC archive
        run: python3 app/scripts/taxonomic-reality-protocol-1259-v2.py --preflight

      - name: Execute exact-name taxon-by-taxon search over 1259 IUCN problem cases
        run: python3 app/scripts/taxonomic-reality-protocol-1259-v2.py --run

      - name: Materialize auditable phase-1 results
        if: success()
        shell: bash
        run: |
          TARGET='evidence/06_stimes/taxonomic_reality_1259/latest'
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp "$TAXON_REALITY_OUT/TAXONOMIC_REALITY_PREFLIGHT.json" "$TARGET/"
          cp "$TAXON_REALITY_OUT/TAXONOMIC_REALITY_1259_RESULTS.csv" "$TARGET/"
          cp "$TAXON_REALITY_OUT/TAXONOMIC_REALITY_NO_RESPONSE_ALL_THREE.csv" "$TARGET/"
          cp "$TAXON_REALITY_OUT/TAXONOMIC_REALITY_SOURCE_INCOMPLETE.csv" "$TARGET/"
          cp "$TAXON_REALITY_OUT/TAXONOMIC_REALITY_1259_QA.json" "$TARGET/"
          printf '%s\n' \
            "github_run_id=${GITHUB_RUN_ID}" \
            "source_commit=${GITHUB_SHA}" \
            'scope=IUCN_PROBLEM_CASES_1259' \
            'sources=POWO_WCVP,WFO,ANTHOS_RJB_CSIC_DWCA_VIA_GBIF_SPAIN_IPT' \
            'phase=EXACT_NAME_REALITY_FILTER' \
            'deletion_authorized=NO' \
            > "$TARGET/RUN_METADATA.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo 'No result change to commit'
          else
            git commit -m 'Materialize taxonomic reality filter v2 for 1259 IUCN problem taxa [skip ci]'
            git push origin HEAD:06-stimes-banco-semillas
          fi

      - name: Upload phase-1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TAXONOMIC_REALITY_1259_THREE_SOURCES_v2
          path: artifacts/taxonomic_reality_1259/
          if-no-files-found: warn
          retention-days: 30
