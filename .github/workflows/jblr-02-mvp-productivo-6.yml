name: JBLR 02 MVP Productivo 6 STAGING

on:
  push:
    branches: [02-mvp-productivo-6]
    paths:
      - 'app/**'
      - '.github/workflows/jblr-02-mvp-productivo-6.yml'
  workflow_dispatch:

concurrency:
  group: jblr-02-mvp-productivo-6-staging
  cancel-in-progress: true

jobs:
  mvp6-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: ${{ secrets.JBLR_STAGING_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Fail closed if STAGING secret is absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo 'STAGING_SECRET_PRESENT=NO'
            exit 78
          fi
          echo 'STAGING_SECRET_PRESENT=YES'

      - name: Initialize evidence directory
        run: mkdir -p evidence

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure baseline STAGING taxon demonstration data
        run: npm run seed:staging

      - name: Install Chromium for responsive UI test
        run: npx playwright install --with-deps chromium

      - name: Start MVP server
        shell: bash
        run: |
          set -euo pipefail
          npm start > evidence/server.log 2>&1 &
          echo $! > /tmp/jblr_mvp6_pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat evidence/server.log
          exit 1

      - name: Run desktop, mobile and evidence E2E
        shell: bash
        env:
          MVP_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm run test:ui | tee evidence/ui-status.txt

      - name: Verify persisted bibliography and evidence state in Neon
        shell: bash
        run: |
          set -euo pipefail
          npm run test:evidence-state | tee evidence/evidence-flow-state.txt

      - name: Verify MVP6 did not change the certified schema files
        shell: bash
        run: |
          set -euo pipefail
          git -C .. diff --quiet 4de1f7653d00a0de51679e4effe8450fb1dee71e HEAD -- db
          echo 'SCHEMA_CHANGES=NONE' | tee evidence/schema-changes.txt

      - name: Verify no client/database secret material is versioned
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'npg_[A-Za-z0-9]+|postgresql://[^:[:space:]]+:[^@[:space:]]+@' public src scripts tests README.md .env.example --exclude='.env.example'
          ! grep -R -n 'DATABASE_URL' public
          echo 'NO_CLIENT_DATABASE_SECRET=PASS' | tee evidence/no-client-secret.txt

      - name: Write minimal MVP6 status evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'OPEN_TAXON_EVIDENCE=PASS'
            echo 'CREATE_BIBLIOGRAPHIC_REFERENCE=PASS'
            echo 'OPEN_BIBLIOGRAPHIC_REFERENCE=PASS'
            echo 'CREATE_ASSERTION=PASS'
            echo 'OPEN_ASSERTION=PASS'
            echo 'LINK_ASSERTION_EVIDENCE=PASS'
            echo 'SHOW_ASSERTION_EVIDENCE=PASS'
            echo 'EDIT_BIBLIOGRAPHIC_REFERENCE=PASS'
            echo 'EDIT_ASSERTION=PASS'
            echo 'PERSIST_EVIDENCE_TO_NEON=PASS'
            echo 'ASSERTION_REMAINS_UNRESOLVED=PASS'
            echo 'REFERENCE_DOES_NOT_EQUAL_ASSERTION=PASS'
            echo 'MOBILE_EVIDENCE_UI=PASS'
            echo 'NO_CLIENT_DATABASE_SECRET=PASS'
            echo 'PROVENANCE_LINK_COUNT=0'
            echo 'PHOTOS_DOCUMENTS=DEFERRED_TO_NEXT_PRODUCTIVE_SLICE'
            echo 'SCHEMA_CHANGES=NONE'
          } | tee evidence/MVP_PRODUCTIVO_6_STATUS.txt

      - name: Upload minimal non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jblr-02-mvp-productivo-6-evidence
          path: app/evidence/
          if-no-files-found: warn
