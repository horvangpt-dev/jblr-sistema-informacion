name: JBLR 02 MVP Productivo 9 STAGING

on:
  push:
    branches: [02-mvp-productivo-9]
    paths:
      - 'app/**'
      - '.github/workflows/jblr-02-mvp-productivo-9.yml'
  workflow_dispatch:

concurrency:
  group: jblr-02-mvp-productivo-9-staging
  cancel-in-progress: true

jobs:
  mvp9-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: ${{ secrets.JBLR_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package.json
      - name: Fail closed if STAGING secret is absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then echo 'STAGING_SECRET_PRESENT=NO'; exit 78; fi
          echo 'STAGING_SECRET_PRESENT=YES'
      - name: Initialize evidence directory
        run: mkdir -p evidence
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure baseline STAGING taxon demonstration data
        run: npm run seed:staging
      - name: Install Chromium for responsive UI test
        run: npx playwright install --with-deps chromium
      - name: Start MVP server
        shell: bash
        run: |
          set -euo pipefail
          npm start > evidence/server.log 2>&1 &
          echo $! > /tmp/jblr_mvp9_pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat evidence/server.log
          exit 1
      - name: Repeat affected navigation tests five times
        shell: bash
        env:
          MVP_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm run test:navigation-antiflake | tee evidence/navigation-antiflake.txt
          {
            echo 'STALE_NAVIGATION_IGNORED=PASS'
            echo 'EXTERNAL_NAVIGATION_RACE_FIXED=PASS'
            echo 'MONITORING_NAVIGATION_RACE_FIXED=PASS'
          } | tee evidence/navigation-race-status.txt
      - name: Run complete desktop, mobile and external data E2E
        shell: bash
        env:
          MVP_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm run test:ui | tee evidence/ui-status.txt
      - name: Verify persisted external scientific data state in Neon
        shell: bash
        run: |
          set -euo pipefail
          npm run test:external-data-state | tee evidence/external-data-state.txt
      - name: Verify MVP9 did not change the certified schema files
        shell: bash
        run: |
          set -euo pipefail
          git -C .. diff --quiet 514d76c1e55b06e2258f9a63c4855e042ac69c26 HEAD -- db
          echo 'SCHEMA_CHANGES=NONE' | tee evidence/schema-changes.txt
      - name: Verify no client/database secret material is versioned
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'npg_[A-Za-z0-9]+|postgresql://[^:[:space:]]+:[^@[:space:]]+@' public src scripts tests README.md .env.example --exclude='.env.example'
          ! grep -R -n 'DATABASE_URL' public
          echo 'NO_CLIENT_DATABASE_SECRET=PASS' | tee evidence/no-client-secret.txt
      - name: Write minimal MVP9 status evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'OPEN_TAXON_EXTERNAL_SOURCES=PASS'
            echo 'CREATE_EXTERNAL_SOURCE=PASS'
            echo 'CREATE_EXTERNAL_RECORD=PASS'
            echo 'OPEN_EXTERNAL_RECORD_DETAIL=PASS'
            echo 'CREATE_EXTERNAL_RECORD_SNAPSHOT=PASS'
            echo 'OPEN_EXTERNAL_RECORD_SNAPSHOT=PASS'
            echo 'PRESERVE_RAW_PAYLOAD=PASS'
            echo 'SHOW_NORMALIZED_PAYLOAD=PASS'
            echo 'CAPTURE_STATUS=PASS'
            echo 'LINK_TAXON_PROVENANCE=PASS'
            echo 'TRACE_TAXON_TO_EXTERNAL_SNAPSHOT=PASS'
            echo 'EXTERNAL_RECORD_NOT_SNAPSHOT=PASS'
            echo 'IMPORT_RECORD_WITHOUT_VALIDATION=PASS'
            echo 'NO_NEW_IDENTIFICATION=PASS'
            echo 'NO_NEW_TAXON_CONCEPT=PASS'
            echo 'PERSIST_EXTERNAL_DATA_TO_NEON=PASS'
            echo 'MOBILE_EXTERNAL_DATA_UI=PASS'
            echo 'NO_CLIENT_DATABASE_SECRET=PASS'
            echo 'STALE_NAVIGATION_IGNORED=PASS'
            echo 'EXTERNAL_NAVIGATION_RACE_FIXED=PASS'
            echo 'MONITORING_NAVIGATION_RACE_FIXED=PASS'
            echo 'PHOTOS_DOCUMENTS=DEFERRED_UNTIL_PERSISTENT_FILE_STORAGE_SLICE'
            echo 'REAL_IMPORTS=NOT_AUTHORIZED'
            echo 'SCHEMA_CHANGES=NONE'
          } | tee evidence/MVP_PRODUCTIVO_9_STATUS.txt
      - name: Upload minimal non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jblr-02-mvp-productivo-9-evidence
          path: app/evidence/
          if-no-files-found: warn
