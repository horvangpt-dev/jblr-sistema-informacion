name: 09 fast documented name-network to EIDOS 185

on:
  push:
    branches:
      - 09-corpus-b-fast-top4-185-recovery-v1
    paths:
      - 'execution/09/corpus-b-source-expansion-v1/spanish-deep/RUN_REQUEST_FAST_NAME_NETWORK_185.json'

permissions:
  contents: write

jobs:
  fast_name_network_185:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09-corpus-b-fast-top4-185-recovery-v1
          fetch-depth: 1

      - name: Validate governed 185 name-network request
        run: |
          python - <<'PY'
          import json
          p=json.load(open('execution/09/corpus-b-source-expansion-v1/spanish-deep/RUN_REQUEST_FAST_NAME_NETWORK_185.json'))
          assert p['enabled'] is True
          assert p['scope'] == 185
          assert p['batchSize'] == 25
          assert p['method'] == 'NAME_NETWORK_TO_EXACT_EIDOS'
          assert p['releaseEvent'] == 'JBLR-EVT-0000-20260824-RELEASE-09-FAST-NAME-NETWORK-185-001'
          assert p['primaryNetworkSource'] == 'GBIF_BACKBONE_EXACT_STRUCTURED_API'
          assert p['top4Primary'] is False
          assert p['top4RescueOnly'] is True
          assert p['crossWithA'] is False
          assert p['neonWrites'] == 0
          assert p['corpusBFreeze'] is False
          assert p['noFuzzy'] is True
          assert p['noParentIdInheritance'] is True
          assert p['noRankCollapse'] is True
          PY

      - name: Persist running heartbeat
        run: |
          set -euo pipefail
          ROOT=execution/09/corpus-b-source-expansion-v1/spanish-deep
          mkdir -p "$ROOT/state"
          cat > "$ROOT/state/FAST_NAME_NETWORK_185_RUNNING.json" <<JSON
          {"state":"RUNNING","method":"NAME_NETWORK_TO_EXACT_EIDOS","scope":185,"batchSize":25,"githubRunId":"${GITHUB_RUN_ID}","githubRunAttempt":"${GITHUB_RUN_ATTEMPT}","requestSha":"${GITHUB_SHA}"}
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin 09-corpus-b-fast-top4-185-recovery-v1
          git add "$ROOT/state/FAST_NAME_NETWORK_185_RUNNING.json"
          git commit -m "state(09): fast name-network 185 running ${GITHUB_RUN_ID}"
          git push origin HEAD:09-corpus-b-fast-top4-185-recovery-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml ddgs

      - name: Download and verify official EIDOS snapshot
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 1800 -o "$RUNNER_TEMP/eidos.ttl" https://datos.iepnb.es/datasets/eidos.ttl
          test -s "$RUNNER_TEMP/eidos.ttl"
          echo '810467771b2493676e47423e1a5705e7983b3bc11d2f5abde902006fc9286737  '"$RUNNER_TEMP/eidos.ttl" | sha256sum -c -

      - name: Execute governed 185 processing in batches of 25
        run: |
          set -euo pipefail
          ROOT=execution/09/corpus-b-source-expansion-v1/spanish-deep
          GROUP_FILE="$ROOT/runs/CORPUS_B_CONTINUOUS_DEEP_SPANISH_313_STRICT_QA_20260824_001/FINAL_COMPACT_GROUPS_313.json"
          REQUEST="$ROOT/RUN_REQUEST_FAST_NAME_NETWORK_185.json"
          OUT="$ROOT/runs/CORPUS_B_FAST_NAME_NETWORK_EIDOS_185_20260824_001"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          python "$ROOT/fast_name_network_185.py" "$GROUP_FILE" "$RUNNER_TEMP/eidos.ttl" "$OUT" "$REQUEST"

      - name: QA compact evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('execution/09/corpus-b-source-expansion-v1/spanish-deep/runs/CORPUS_B_FAST_NAME_NETWORK_EIDOS_185_20260824_001')
          r=json.load(open(out/'RUN_RECEIPT.json'))
          assert r['inputRows'] == 185
          assert r['batchSize'] == 25
          assert r['plannedBatches'] == 8
          assert r['method'] == 'DOCUMENTED_STRUCTURED_NAME_NETWORK_THEN_EXACT_EIDOS_CONTRAST'
          assert r['primaryNetworkSource'] == 'GBIF_BACKBONE_EXACT_STRUCTURED_API'
          assert r['eidosSha256'] == '810467771b2493676e47423e1a5705e7983b3bc11d2f5abde902006fc9286737'
          assert r['top4Primary'] is False and r['top4RescueOnly'] is True
          assert r['crossWithA'] is False and r['neonWrites'] == 0 and r['corpusBFreeze'] is False
          assert r['noFuzzy'] is True and r['noParentIdInheritance'] is True and r['noRankCollapse'] is True
          assert r['processedRows'] == sum(b['inputRows'] for b in r['batchReceipts'])
          assert (r['allBatchesCompleted'] and r['processedRows'] == 185) or r['stopRequired']
          for p in out.rglob('*.json'):
              assert p.stat().st_size < 100*1024*1024, (str(p), p.stat().st_size)
          PY

      - name: Persist compact batch evidence
        run: |
          set -euo pipefail
          ROOT=execution/09/corpus-b-source-expansion-v1/spanish-deep
          OUT="$ROOT/runs/CORPUS_B_FAST_NAME_NETWORK_EIDOS_185_20260824_001"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('execution/09/corpus-b-source-expansion-v1/spanish-deep')
          out=root/'runs/CORPUS_B_FAST_NAME_NETWORK_EIDOS_185_20260824_001'
          r=json.load(open(out/'RUN_RECEIPT.json'))
          state={
              'state': 'TERMINAL_COMPLETE' if r['allBatchesCompleted'] else 'STOP_REQUIRED_ANOMALY',
              'githubRunId': os.environ['GITHUB_RUN_ID'],
              'processedRows': r['processedRows'],
              'resolvedCount': r['resolvedCount'],
              'stopRequired': r['stopRequired'],
              'stopReason': r['stopReason'],
              'crossWithA': False,
              'neonWrites': 0,
              'corpusBFreeze': False,
          }
          (root/'state/FAST_NAME_NETWORK_185_TERMINAL.json').write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin 09-corpus-b-fast-top4-185-recovery-v1
          git add "$OUT" "$ROOT/state/FAST_NAME_NETWORK_185_TERMINAL.json"
          git commit -m "evidence(09): fast name-network 185 ${GITHUB_RUN_ID}"
          git push origin HEAD:09-corpus-b-fast-top4-185-recovery-v1

      - name: Enforce anomaly stop
        run: |
          python - <<'PY'
          import json
          p='execution/09/corpus-b-source-expansion-v1/spanish-deep/runs/CORPUS_B_FAST_NAME_NETWORK_EIDOS_185_20260824_001/RUN_RECEIPT.json'
          r=json.load(open(p))
          if r['stopRequired']:
              raise SystemExit('STOP_REQUIRED: '+str(r['stopReason']))
          assert r['allBatchesCompleted'] is True and r['processedRows'] == 185
          PY
