name: JBLR 07 RJB Metadata Probe

on:
  push:
    branches:
      - 07-biblioteca-index
    paths:
      - '.github/workflows/07_rjb_probe.yml'
      - 'library/07_biblioteca/diagnostics/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/07_rjb_probe.yml'
      - 'library/07_biblioteca/diagnostics/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 pypdf
      - name: Probe RJB frontend metadata
        run: python library/07_biblioteca/diagnostics/probe_rjb.py
      - name: Probe BHL Flora iberica index
        run: python library/07_biblioteca/diagnostics/probe_bhl.py
      - name: Probe RAC known volume link
        run: python library/07_biblioteca/diagnostics/probe_rac_camaranino.py
      - name: Probe RAC public object IDs for Cámara Niño
        run: python library/07_biblioteca/diagnostics/probe_rac_ids.py
