name: JBLR 01.6 Neon Sqitch CLI STAGING Main Deployment

on:
  push:
    branches: [01.6-staging-neon-adaptation]
    paths:
      - '.github/workflows/jblr-01-6-neon-sqitch-staging-main.yml'

concurrency:
  group: jblr-01-6-neon-sqitch-staging-main
  cancel-in-progress: true

jobs:
  staging-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_PROJECT_ID: crimson-hall-16978747
      TARGET_BRANCH_ID: br-polished-pond-b24mvk11
      TARGET_BRANCH_NAME: production
      TARGET_ENDPOINT_ID: ep-hidden-sound-b2uab7di
      TARGET_HOST: ep-hidden-sound-b2uab7di.c-6.eu-central-1.aws.neon.tech
      TARGET_DB: neondb
      TARGET_USER: neondb_owner
      BASELINE_PATH: db/baseline/JBLR_01_2_R2_DDL_PILOT_FIX1.sql
      BASELINE_SOURCE_BRANCH: 01.2r-baseline-fix
      BASELINE_SOURCE_COMMIT: 2e18c9fdfe9cf9222c8297b93ca0c705e7fb7443
      BASELINE_SHA256: 21c533e9e587eb1179ce54c951339f365599f60b9bb6905bb79641866787d8aa
      BASELINE_SIZE: '107012'
      CERTIFIED_COMMIT: 75b567d15d6b610939ccdc95009a8aa0d30dd8b6

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize evidence
        run: mkdir -p evidence

      - name: Install PostgreSQL client and Sqitch
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          timeout 90s sudo apt-get -o Acquire::Retries=2 update
          timeout 120s sudo apt-get install -y --no-install-recommends postgresql-client sqitch libdbd-pg-perl
          psql --version | tee evidence/psql_version.txt
          sqitch --version | tee evidence/sqitch_version.txt

      - name: Verify immutable package and target declaration
        run: |
          set -euo pipefail
          git diff --exit-code "$CERTIFIED_COMMIT" -- db/sqitch
          grep -F "NOT (table_schema='governance' AND table_name='schema_release')" db/sqitch/verify/core_physical_model_v1.sql
          test "${TARGET_HOST%%.*}" = "$TARGET_ENDPOINT_ID"
          {
            echo "certified_commit=$CERTIFIED_COMMIT"
            echo "technical_branch=$GITHUB_REF_NAME"
            echo "technical_commit=$GITHUB_SHA"
            echo "target_project_id=$TARGET_PROJECT_ID"
            echo "target_branch_id=$TARGET_BRANCH_ID"
            echo "target_branch_name=$TARGET_BRANCH_NAME"
            echo "target_endpoint_id=$TARGET_ENDPOINT_ID"
            echo "target_host=$TARGET_HOST"
            echo "target_database=$TARGET_DB"
            echo "target_user=$TARGET_USER"
          } | tee evidence/run_identity.txt

      - name: Materialize normative FIX1 and verify SHA-256
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASELINE_SOURCE_BRANCH"
          git cat-file -e "$BASELINE_SOURCE_COMMIT^{commit}"
          mkdir -p "$(dirname "$BASELINE_PATH")"
          git show "$BASELINE_SOURCE_COMMIT:$BASELINE_PATH" > "$BASELINE_PATH"
          test "$(wc -c < "$BASELINE_PATH")" = "$BASELINE_SIZE"
          echo "$BASELINE_SHA256  $BASELINE_PATH" | sha256sum -c - | tee evidence/baseline_hash_check.txt

      - name: Fail-closed direct protected STAGING deployment
        shell: bash
        env:
          STAGING_DATABASE_URL: ${{ secrets.JBLR_STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${STAGING_DATABASE_URL:-}" ]]; then
            echo 'STAGING_SECRET_PRESENT=NO' | tee evidence/staging_secret_status.txt
            echo 'ABORT: GitHub Actions secret JBLR_STAGING_DATABASE_URL is not configured; no connection or mutation attempted.' >&2
            exit 78
          fi
          echo 'STAGING_SECRET_PRESENT=YES' | tee evidence/staging_secret_status.txt

          mapfile -t DB_PARTS < <(python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, unquote, parse_qs

          raw = os.environ['STAGING_DATABASE_URL']
          u = urlsplit(raw)
          if u.scheme not in ('postgres', 'postgresql'):
              raise SystemExit('unsupported database URL scheme')
          q = parse_qs(u.query)
          values = [
              u.hostname or '',
              str(u.port or 5432),
              unquote(u.username or ''),
              unquote(u.password or ''),
              (u.path or '/').lstrip('/'),
              q.get('sslmode', ['require'])[-1],
              q.get('channel_binding', ['prefer'])[-1],
          ]
          for value in values:
              print(value)
          PY
          )
          test "${#DB_PARTS[@]}" -eq 7

          export PGHOST="${DB_PARTS[0]}"
          export PGPORT="${DB_PARTS[1]}"
          export PGUSER="${DB_PARTS[2]}"
          export PGPASSWORD="${DB_PARTS[3]}"
          export PGDATABASE="${DB_PARTS[4]}"
          export PGSSLMODE="${DB_PARTS[5]}"
          export PGCHANNELBINDING="${DB_PARTS[6]}"
          echo "::add-mask::$PGPASSWORD"
          unset STAGING_DATABASE_URL DB_PARTS

          # Declaration checks are local and non-mutating.
          if [[ "$PGHOST" != "$TARGET_HOST" || "$PGDATABASE" != "$TARGET_DB" || "$PGUSER" != "$TARGET_USER" ]]; then
            echo 'STAGING_CONNECTION_DECLARATION=FAIL' | tee evidence/staging_connection_declaration.txt
            echo 'ABORT: protected connection declaration does not match authorized STAGING host/database/user; no connection or mutation attempted.' >&2
            exit 41
          fi
          echo 'STAGING_CONNECTION_DECLARATION=PASS' | tee evidence/staging_connection_declaration.txt

          # Mandatory read-only Neon identity proof. No mutation before exact match.
          ACTUAL_IDENTITY="$(psql -X -v ON_ERROR_STOP=1 -Atqc "select 'JBLR_ADMIN_IDENTITY|'||coalesce(current_setting('neon.project_id', true),'')||'|'||coalesce(current_setting('neon.branch_id', true),'')||'|'||coalesce(current_setting('neon.endpoint_id', true),'')||'|'||current_database()||'|'||current_user")"
          EXPECTED_IDENTITY="JBLR_ADMIN_IDENTITY|$TARGET_PROJECT_ID|$TARGET_BRANCH_ID|$TARGET_ENDPOINT_ID|$TARGET_DB|$TARGET_USER"
          printf 'actual=%s\nexpected=%s\n' "$ACTUAL_IDENTITY" "$EXPECTED_IDENTITY" | tee evidence/admin_target_identity.txt
          if [[ "$ACTUAL_IDENTITY" != "$EXPECTED_IDENTITY" ]]; then
            echo 'ADMIN_TARGET_BINDING=FAIL' | tee evidence/admin_target_binding.txt
            echo 'ABORT: wrong Neon target identity; no mutation executed.' >&2
            exit 42
          fi
          echo 'ADMIN_TARGET_BINDING=PASS' | tee evidence/admin_target_binding.txt
          echo 'STAGING_DIRECT_AUTH=PASS' | tee evidence/staging_direct_auth.txt

          # Mutations are allowed only after the exact target binding PASS above.
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
          psql -X -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

          psql -X -v ON_ERROR_STOP=1 -f "$BASELINE_PATH" > evidence/baseline_install.log
          BASE_TABLES="$(psql -X -Atqc "select count(*) from information_schema.tables where table_schema in ('core','taxonomy','field','material','evidence','governance','analytics','security') and table_type='BASE TABLE'")"
          BASE_VIEWS="$(psql -X -Atqc "select count(*) from information_schema.views where table_schema in ('core','taxonomy','field','material','evidence','governance','analytics','security')")"
          test "$BASE_TABLES" = '85'
          test "$BASE_VIEWS" = '8'
          echo 'FIX1_INSTALL=PASS' | tee evidence/fix1_install.txt

          (
            cd db/sqitch
            SQITCH_TARGET="db:pg://$PGUSER@$PGHOST:$PGPORT/$PGDATABASE"
            sqitch deploy "$SQITCH_TARGET" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_cli_deploy.log"
            sqitch verify "$SQITCH_TARGET" 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_cli_verify.log"
          )

          SQITCH_CHANGES="$(psql -X -Atqc 'select count(*) from sqitch.changes')"
          FINAL_TABLES="$(psql -X -Atqc "select count(*) from information_schema.tables where table_schema in ('core','taxonomy','field','material','evidence','governance','analytics','security','migration_staging') and table_type='BASE TABLE'")"
          FINAL_VIEWS="$(psql -X -Atqc "select count(*) from information_schema.views where table_schema in ('core','taxonomy','field','material','evidence','governance','analytics','security','migration_staging')")"
          test "$SQITCH_CHANGES" = '3'
          test "$FINAL_TABLES" = '91'
          test "$FINAL_VIEWS" = '8'

          psql -X -Atqc "select extname||'='||extversion from pg_extension where extname in ('postgis','pg_trgm') order by extname" > evidence/extensions.txt
          grep -Fx 'pg_trgm=1.6' evidence/extensions.txt
          grep -Fx 'postgis=3.6.0' evidence/extensions.txt
          psql -X -P pager=off -c 'select change_id,committed_at from sqitch.changes order by committed_at' > evidence/sqitch_changes.txt

          {
            echo 'STAGING_MAIN_DEPLOYMENT=PASS'
            echo 'ADMIN_TARGET_BINDING=PASS'
            echo 'STAGING_DIRECT_AUTH=PASS'
            echo 'FIX1_SHA=PASS'
            echo 'FIX1_INSTALL=PASS'
            echo 'SQITCH_CLI_STAGING_DEPLOY=PASS'
            echo 'SQITCH_CLI_STAGING_VERIFY=PASS'
            echo "baseline_tables=$BASE_TABLES"
            echo "baseline_views=$BASE_VIEWS"
            echo "final_tables=$FINAL_TABLES"
            echo "final_views=$FINAL_VIEWS"
            echo "sqitch_changes=$SQITCH_CHANGES"
            echo "target_project_id=$TARGET_PROJECT_ID"
            echo "target_branch_id=$TARGET_BRANCH_ID"
            echo "target_endpoint_id=$TARGET_ENDPOINT_ID"
            echo "target_host=$TARGET_HOST"
            echo "target_database=$TARGET_DB"
            echo "target_user=$TARGET_USER"
            echo "technical_commit=$GITHUB_SHA"
            echo "fix1_sha256=$BASELINE_SHA256"
          } | tee evidence/STAGING_MAIN_STATUS.txt

          unset PGPASSWORD PGHOST PGPORT PGUSER PGDATABASE PGSSLMODE PGCHANNELBINDING SQITCH_TARGET ACTUAL_IDENTITY EXPECTED_IDENTITY

      - name: Upload non-secret STAGING evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jblr-01-6-staging-main-evidence
          path: evidence/
          if-no-files-found: warn
