name: JBLR 01.4R Full Certification FIX1
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: jblr_src
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jblr_src"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: jblr_src
      BASELINE_FILE: JBLR_01_2_R2_DDL_PILOT_FIX1.sql
      BASELINE_PATH: db/baseline/JBLR_01_2_R2_DDL_PILOT_FIX1.sql
      BASELINE_SOURCE_COMMIT: 2e18c9fdfe9cf9222c8297b93ca0c705e7fb7443
      BASELINE_SOURCE_BRANCH: 01.2r-baseline-fix
      BASELINE_SHA256: 21c533e9e587eb1179ce54c951339f365599f60b9bb6905bb79641866787d8aa
      BASELINE_SIZE: "107012"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize evidence directory
        run: mkdir -p evidence

      - name: Install SQL client and Sqitch
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client sqitch libdbd-pg-perl
          psql --version | tee evidence/host_psql_version.txt
          sqitch --version | tee evidence/sqitch_version.txt

      - name: Materialize normative FIX1 from certified 01.2R Git commit
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASELINE_SOURCE_BRANCH"
          git cat-file -e "$BASELINE_SOURCE_COMMIT^{commit}"
          mkdir -p "$(dirname "$BASELINE_PATH")"
          git show "$BASELINE_SOURCE_COMMIT:$BASELINE_PATH" > "$BASELINE_PATH"
          test "$(wc -c < "$BASELINE_PATH")" = "$BASELINE_SIZE"
          echo "$BASELINE_SHA256  $BASELINE_PATH" | sha256sum -c - | tee evidence/baseline_hash_check.txt
          sha256sum "$BASELINE_PATH" > evidence/baseline.sha256
          {
            echo "baseline_file=$BASELINE_FILE"
            echo "baseline_size=$BASELINE_SIZE"
            echo "baseline_sha256=$BASELINE_SHA256"
            echo "baseline_source_branch=$BASELINE_SOURCE_BRANCH"
            echo "baseline_source_commit=$BASELINE_SOURCE_COMMIT"
            echo "baseline_git_blob=$(git rev-parse "$BASELINE_SOURCE_COMMIT:$BASELINE_PATH")"
          } | tee evidence/baseline_identity.txt

      - name: Record engine and tool versions
        run: |
          set -euo pipefail
          SRC_CID=$(docker ps --filter ancestor=postgis/postgis:18-3.6 --format '{{.ID}}' | head -1)
          test -n "$SRC_CID"
          {
            echo "source_sha=$SOURCE_SHA"
            echo "github_event_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "repository=$GITHUB_REPOSITORY"
            echo "baseline_sha256=$BASELINE_SHA256"
            psql --version
            docker exec "$SRC_CID" psql --version
            docker exec "$SRC_CID" pg_dump --version
            sqitch --version
            psql -X -Atqc 'select version()'
          } | tee evidence/versions.txt

      - name: Clean install normative FIX1 with PostgreSQL 18 psql
        run: |
          set -euo pipefail
          SRC_CID=$(docker ps --filter ancestor=postgis/postgis:18-3.6 --format '{{.ID}}' | head -1)
          cat "$BASELINE_PATH" | docker exec -i "$SRC_CID" psql -X -v ON_ERROR_STOP=1 -U postgres -d jblr_src > evidence/baseline_install.log
          psql -X -v ON_ERROR_STOP=1 -d jblr_src -f tests/verify_inventory.sql | tee evidence/inventory_baseline_source.log
          psql -X -Atqc "select extname||'='||extversion from pg_extension where extname in ('postgis','pg_trgm') order by 1" | tee evidence/extensions_source.txt

      - name: Execute Sqitch deploy and verify for real
        run: |
          set -euo pipefail
          cd db/sqitch
          sqitch deploy 'db:pg://postgres@localhost/jblr_src' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_deploy.log"
          sqitch verify 'db:pg://postgres@localhost/jblr_src' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_verify.log"
          cd "$GITHUB_WORKSPACE"
          test "$(psql -X -Atqc "select case when to_regclass('sqitch.changes') is null then 0 else 1 end")" = "1"
          test "$(psql -X -Atqc "select count(*) from sqitch.changes")" = "3"
          PLAN_SHA=$(sha256sum db/sqitch/sqitch.plan | awk '{print $1}')
          psql -X -v ON_ERROR_STOP=1 -c "insert into governance.schema_release(release_id,jblr_release,environment_code,conceptual_version,logical_version,physical_baseline_version,baseline_sha256,sqitch_project,sqitch_plan_hash,git_commit_sha,applied_by,release_status,verification_result,notes) values(uuidv7(),'JBLR_DB_PREPROD_01_4R_CERT','TEST','CORE_CONCEPT_v1','CORE_LOGICAL_MODEL_v1','CORE_PHYSICAL_MODEL_v1','$BASELINE_SHA256','jblr-db','$PLAN_SHA','$SOURCE_SHA','github-actions','verified','sqitch deploy+verify','01.4R FIX1 technical certification; no production authorization')"
          psql -X -P pager=off -c "select jblr_release,environment_code,physical_baseline_version,baseline_sha256,git_commit_sha,release_status from governance.schema_release" | tee evidence/schema_release_source.txt

      - name: Safe Sqitch revert and redeploy on disposable database
        run: |
          set -euo pipefail
          createdb jblr_revert
          SRC_CID=$(docker ps --filter ancestor=postgis/postgis:18-3.6 --format '{{.ID}}' | head -1)
          cat "$BASELINE_PATH" | docker exec -i "$SRC_CID" psql -X -v ON_ERROR_STOP=1 -U postgres -d jblr_revert >/dev/null
          cd db/sqitch
          sqitch deploy 'db:pg://postgres@localhost/jblr_revert' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_revert_db_deploy.log"
          sqitch verify 'db:pg://postgres@localhost/jblr_revert' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_revert_db_verify.log"
          sqitch revert 'db:pg://postgres@localhost/jblr_revert' --to core_physical_model_v1 -y 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_revert.log"
          cd "$GITHUB_WORKSPACE"
          test "$(psql -X -Atqc "select case when to_regclass('governance.schema_release') is null then 0 else 1 end" -d jblr_revert)" = "0"
          cd db/sqitch
          sqitch deploy 'db:pg://postgres@localhost/jblr_revert' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_redeploy.log"
          sqitch verify 'db:pg://postgres@localhost/jblr_revert' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_redeploy_verify.log"
          cd "$GITHUB_WORKSPACE"
          test "$(psql -X -Atqc "select count(*) from sqitch.changes" -d jblr_revert)" = "3"

      - name: Apply roles and ownership and verify effective privileges
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d jblr_src -f ops/preprod_roles.sql | tee evidence/roles_apply.log
          psql -X -v ON_ERROR_STOP=1 -d jblr_src -f ops/01_4r_assign_ownership.sql | tee evidence/ownership_apply.log
          psql -X -P pager=off -d jblr_src -c "select rolname,rolcanlogin,rolsuper,rolcreaterole,rolcreatedb,rolinherit from pg_roles where rolname like 'jblr_db_%' order by 1" | tee evidence/roles_attributes.txt
          psql -X -P pager=off -d jblr_src -c "select member.rolname as member_of, role.rolname as granted_role from pg_auth_members m join pg_roles role on role.oid=m.roleid join pg_roles member on member.oid=m.member where role.rolname like 'jblr_db_%' or member.rolname like 'jblr_db_%' order by 1,2" | tee evidence/role_memberships.txt
          psql -X -P pager=off -d jblr_src -c "select grantee,table_schema,privilege_type,count(*) from information_schema.role_table_grants where grantee like 'jblr_db_%' group by 1,2,3 order by 1,2,3" | tee evidence/table_grants_summary.txt
          psql -X -P pager=off -d jblr_src -c "select n.nspname,pg_get_userbyid(n.nspowner) owner from pg_namespace n where n.nspname in ('core','taxonomy','field','material','evidence','governance','analytics','security','migration_staging') order by 1" | tee evidence/schema_ownership_source.txt
          test "$(psql -X -Atqc "select count(*) from pg_roles where rolname like 'jblr_db_%'")" = "8"
          test "$(psql -X -Atqc "select count(*) from pg_roles where rolname like 'jblr_db_%' and rolcanlogin")" = "0"
          test "$(psql -X -Atqc "select count(*) from pg_namespace where nspname in ('core','taxonomy','field','material','evidence','governance','analytics','security','migration_staging') and pg_get_userbyid(nspowner)<>'jblr_db_owner'")" = "0"
          test "$(psql -X -Atqc "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('core','taxonomy','field','material','evidence','governance','analytics','security','migration_staging') and c.relkind in ('r','p','v','m','S','f') and pg_get_userbyid(c.relowner)<>'jblr_db_owner'")" = "0"
          test "$(psql -X -Atqc "select has_schema_privilege('jblr_db_app','core','CREATE')")" = "f"
          test "$(psql -X -Atqc "select has_schema_privilege('jblr_db_reader','core','CREATE')")" = "f"

      - name: Prepare synthetic C4 fixture and execute C1-C5
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -d jblr_src -c "insert into evidence.external_source(external_source_id,source_code,source_name,source_type,is_active) values('018f0000-0000-7000-8000-00000000007c','R2_SYNTH','R2 synthetic concurrency source','synthetic',true) on conflict do nothing"
          psql -X -v ON_ERROR_STOP=1 -d jblr_src -f tests/verify_inventory.sql | tee evidence/inventory_source.log
          bash tests/r2_concurrency.sh jblr_src evidence/c1_c5_source
          grep -F 'CONCURRENCY_SUMMARY pass=5 fail=0' evidence/c1_c5_source/concurrency_jblr_src.log

      - name: Generate portable PostgreSQL 18 backup
        run: |
          set -euo pipefail
          SRC_CID=$(docker ps --filter ancestor=postgis/postgis:18-3.6 --format '{{.ID}}' | head -1)
          docker exec "$SRC_CID" pg_dump -Fc -U postgres -d jblr_src > evidence/jblr_preprod_FIX1.dump
          docker exec "$SRC_CID" pg_dumpall -U postgres --roles-only > evidence/jblr_preprod_roles.sql
          sha256sum evidence/jblr_preprod_FIX1.dump | tee evidence/jblr_preprod_FIX1.dump.sha256
          sha256sum evidence/jblr_preprod_roles.sql | tee evidence/jblr_preprod_roles.sql.sha256
          {
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_sha=$SOURCE_SHA"
            echo "baseline_file=$BASELINE_FILE"
            echo "baseline_sha256=$BASELINE_SHA256"
            echo "format=pg_dump custom (-Fc)"
            echo "roles_companion=pg_dumpall --roles-only"
            docker exec "$SRC_CID" pg_dump --version
          } | tee evidence/backup_manifest.txt

      - name: Real restore in independent PostgreSQL 18 PostGIS cluster
        run: |
          set -euo pipefail
          docker run -d --name jblr-restore-pg -e POSTGRES_DB=jblr_restore -e POSTGRES_HOST_AUTH_METHOD=trust -p 55431:5432 postgis/postgis:18-3.6 > evidence/restore_container_id.txt
          for i in $(seq 1 60); do pg_isready -h localhost -p 55431 -U postgres -d jblr_restore && break; sleep 1; done
          PGPORT=55431 psql -X -v ON_ERROR_STOP=1 -d jblr_restore <<'SQL'
          DO $$ DECLARE r text; BEGIN
            FOREACH r IN ARRAY ARRAY['jblr_db_owner','jblr_db_admin','jblr_db_migrator','jblr_db_app','jblr_db_reader','jblr_db_analyst','jblr_db_backup','jblr_db_auditor'] LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname=r) THEN EXECUTE format('CREATE ROLE %I NOLOGIN',r); END IF;
            END LOOP;
          END $$;
          SQL
          RESTORE_CID=$(docker ps --filter name=jblr-restore-pg --format '{{.ID}}' | head -1)
          cat evidence/jblr_preprod_FIX1.dump | docker exec -i "$RESTORE_CID" pg_restore --exit-on-error -U postgres -d jblr_restore 2>&1 | tee evidence/restore.log
          PGPORT=55431 psql -X -v ON_ERROR_STOP=1 -d jblr_restore -f tests/verify_inventory.sql | tee evidence/inventory_restore.log
          test "$(PGPORT=55431 psql -X -Atqc "select count(*) from sqitch.changes" -d jblr_restore)" = "3"
          test "$(PGPORT=55431 psql -X -Atqc "select count(*) from governance.schema_release where jblr_release='JBLR_DB_PREPROD_01_4R_CERT' and baseline_sha256='$BASELINE_SHA256'" -d jblr_restore)" = "1"
          test "$(PGPORT=55431 psql -X -Atqc "select count(*) from pg_namespace where nspname in ('core','taxonomy','field','material','evidence','governance','analytics','security','migration_staging') and pg_get_userbyid(nspowner)<>'jblr_db_owner'" -d jblr_restore)" = "0"
          PGPORT=55431 psql -X -P pager=off -d jblr_restore -c "select jblr_release,baseline_sha256,git_commit_sha,release_status from governance.schema_release" | tee evidence/schema_release_restore.txt

      - name: Second completely clean installation from versioned sources
        run: |
          set -euo pipefail
          docker run -d --name jblr-clean-pg -e POSTGRES_DB=jblr_clean -e POSTGRES_HOST_AUTH_METHOD=trust -p 55432:5432 postgis/postgis:18-3.6 > evidence/clean_container_id.txt
          for i in $(seq 1 60); do pg_isready -h localhost -p 55432 -U postgres -d jblr_clean && break; sleep 1; done
          echo "$BASELINE_SHA256  $BASELINE_PATH" | sha256sum -c - | tee evidence/clean_baseline_hash_check.txt
          CLEAN_CID=$(docker ps --filter name=jblr-clean-pg --format '{{.ID}}' | head -1)
          cat "$BASELINE_PATH" | docker exec -i "$CLEAN_CID" psql -X -v ON_ERROR_STOP=1 -U postgres -d jblr_clean > evidence/clean_baseline.log
          cd db/sqitch
          sqitch deploy 'db:pg://postgres@localhost:55432/jblr_clean' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/clean_sqitch_deploy.log"
          sqitch verify 'db:pg://postgres@localhost:55432/jblr_clean' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/clean_sqitch_verify.log"
          cd "$GITHUB_WORKSPACE"
          PGPORT=55432 psql -X -v ON_ERROR_STOP=1 -d jblr_clean -f ops/preprod_roles.sql > evidence/clean_roles.log
          PGPORT=55432 psql -X -v ON_ERROR_STOP=1 -d jblr_clean -f ops/01_4r_assign_ownership.sql > evidence/clean_ownership.log
          PLAN_SHA=$(sha256sum db/sqitch/sqitch.plan | awk '{print $1}')
          PGPORT=55432 psql -X -v ON_ERROR_STOP=1 -d jblr_clean -c "insert into governance.schema_release(release_id,jblr_release,environment_code,conceptual_version,logical_version,physical_baseline_version,baseline_sha256,sqitch_project,sqitch_plan_hash,git_commit_sha,applied_by,release_status,verification_result,notes) values(uuidv7(),'JBLR_DB_PREPROD_01_4R_CERT','TEST','CORE_CONCEPT_v1','CORE_LOGICAL_MODEL_v1','CORE_PHYSICAL_MODEL_v1','$BASELINE_SHA256','jblr-db','$PLAN_SHA','$SOURCE_SHA','github-actions','verified','clean install sqitch deploy+verify','01.4R clean reconstruction; no production authorization')"
          PGPORT=55432 psql -X -v ON_ERROR_STOP=1 -d jblr_clean -c "insert into evidence.external_source(external_source_id,source_code,source_name,source_type,is_active) values('018f0000-0000-7000-8000-00000000007c','R2_SYNTH','R2 synthetic concurrency source','synthetic',true) on conflict do nothing"
          PGPORT=55432 psql -X -v ON_ERROR_STOP=1 -d jblr_clean -f tests/verify_inventory.sql | tee evidence/inventory_clean.log
          test "$(PGPORT=55432 psql -X -Atqc "select count(*) from pg_namespace where nspname in ('core','taxonomy','field','material','evidence','governance','analytics','security','migration_staging') and pg_get_userbyid(nspowner)<>'jblr_db_owner'" -d jblr_clean)" = "0"
          PGPORT=55432 bash tests/r2_concurrency.sh jblr_clean evidence/c1_c5_clean
          grep -F 'CONCURRENCY_SUMMARY pass=5 fail=0' evidence/c1_c5_clean/concurrency_jblr_clean.log

      - name: Compare source restore and clean structural inventories
        run: |
          set -euo pipefail
          inventory() {
            local port="$1" db="$2" out="$3"
            PGPORT="$port" psql -X -d "$db" -AtF'|' -c "select 'SCHEMA',n.nspname,pg_get_userbyid(n.nspowner) from pg_namespace n where n.nspname in ('core','taxonomy','field','material','evidence','governance','analytics','security','migration_staging','sqitch') union all select 'REL',n.nspname||'.'||c.relname,c.relkind||':'||pg_get_userbyid(c.relowner) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('core','taxonomy','field','material','evidence','governance','analytics','security','migration_staging','sqitch') and c.relkind in ('r','p','v','m','S','f') union all select 'EXT',extname,extversion from pg_extension where extname in ('postgis','pg_trgm') order by 1,2,3" > "$out"
          }
          inventory 5432 jblr_src evidence/inventory_struct_source.txt
          inventory 55431 jblr_restore evidence/inventory_struct_restore.txt
          inventory 55432 jblr_clean evidence/inventory_struct_clean.txt
          diff -u evidence/inventory_struct_source.txt evidence/inventory_struct_restore.txt | tee evidence/diff_source_restore.txt
          diff -u evidence/inventory_struct_source.txt evidence/inventory_struct_clean.txt | tee evidence/diff_source_clean.txt
          echo 'STRUCTURAL_COMPARISON=PASS' | tee evidence/structural_comparison_status.txt

      - name: Mark certification success
        run: |
          cat > evidence/CERTIFICATION_STATUS.txt <<EOF
          01_4R_PIPELINE=PASS
          baseline_file=$BASELINE_FILE
          baseline_sha256=$BASELINE_SHA256
          source_sha=$SOURCE_SHA
          production_authorized=NO
          taxa_import_authorized=NO
          EOF

      - name: Final technical evidence manifest
        if: always()
        run: |
          mkdir -p evidence
          set +e
          {
            echo "source_sha=$SOURCE_SHA"
            echo "github_event_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "repository=$GITHUB_REPOSITORY"
            echo "baseline_file=$BASELINE_FILE"
            echo "baseline_sha256=$BASELINE_SHA256"
            echo "baseline_source_commit=$BASELINE_SOURCE_COMMIT"
            echo "production_authorized=NO"
            echo "taxa_import_authorized=NO"
          } > evidence/RUN_IDENTITY.txt
          find evidence -maxdepth 4 -type f -printf '%P\n' | sort > evidence/INVENTORY.txt
          find evidence -type f ! -name EVIDENCE_SHA256.txt -print0 | sort -z | xargs -0 sha256sum > evidence/EVIDENCE_SHA256.txt 2>/dev/null

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jblr-01-4r-FIX1-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence
          if-no-files-found: error
