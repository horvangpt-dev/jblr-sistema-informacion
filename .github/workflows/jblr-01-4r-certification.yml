name: JBLR 01.4R Full Certification
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: jblr_src
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jblr_src"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: jblr_src
      BASELINE_SHA256: 50abe00a643d15e7b940580cce68d1abd34c6b6ccb06edd81f2e86973cb73d07
      BUNDLE_SHA256: 4f52d2617cd3014e0931e4883c3d4b77f482a705ae04b60f694e0c0dd549f59f
    steps:
      - uses: actions/checkout@v4

      - name: Install clients and Sqitch
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client sqitch libdbd-pg-perl unzip
          psql --version
          pg_dump --version
          sqitch --version

      - name: Reconstruct exact Drive technical bundle
        run: |
          set -euo pipefail
          base64 -d .cert_payload_01_4r/JBLR_01_4_TECHNICAL_BUNDLE.zip.b64 > /tmp/JBLR_01_4_TECHNICAL_BUNDLE.zip
          echo "$BUNDLE_SHA256  /tmp/JBLR_01_4_TECHNICAL_BUNDLE.zip" | sha256sum -c -
          mkdir -p /tmp/jblr-src
          unzip -q /tmp/JBLR_01_4_TECHNICAL_BUNDLE.zip -d /tmp/jblr-src
          cd /tmp/jblr-src
          sha256sum -c manifests/JBLR_01_4_MANIFEST_SHA256.txt
          echo "$BASELINE_SHA256  db/baseline/JBLR_01_2_R2_DDL_PILOT.sql" | sha256sum -c -

      - name: Record engine versions
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo "github_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            psql -X -Atqc 'select version()'
            psql -X -Atqc "select extname||'='||extversion from pg_extension where extname in ('postgis','pg_trgm') order by 1" || true
            sqitch --version
            pg_dump --version
          } | tee evidence/versions.txt

      - name: Install immutable baseline
        run: |
          set -euo pipefail
          cd /tmp/jblr-src
          psql -X -v ON_ERROR_STOP=1 -d jblr_src -f db/baseline/JBLR_01_2_R2_DDL_PILOT.sql | tee "$GITHUB_WORKSPACE/evidence/baseline_install.log"
          psql -X -Atqc "select extname||'='||extversion from pg_extension where extname in ('postgis','pg_trgm') order by 1" | tee -a "$GITHUB_WORKSPACE/evidence/versions.txt"

      - name: Execute Sqitch deploy and verify for real
        run: |
          set -euo pipefail
          cd /tmp/jblr-src/db/sqitch
          sqitch target add ci 'db:pg://postgres@localhost/jblr_src'
          sqitch deploy ci 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_deploy.log"
          sqitch verify ci 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_verify.log"
          psql -X -d jblr_src -Atqc "select count(*) from information_schema.tables where table_schema='sqitch'" | tee "$GITHUB_WORKSPACE/evidence/sqitch_registry_table_count.txt"

      - name: Safe Sqitch revert and redeploy proof on disposable database
        run: |
          set -euo pipefail
          createdb jblr_revert
          cd /tmp/jblr-src
          psql -X -v ON_ERROR_STOP=1 -d jblr_revert -f db/baseline/JBLR_01_2_R2_DDL_PILOT.sql >/dev/null
          cd db/sqitch
          sqitch deploy 'db:pg://postgres@localhost/jblr_revert' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_revert_db_deploy.log"
          sqitch revert 'db:pg://postgres@localhost/jblr_revert' -y 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_revert.log"
          sqitch deploy 'db:pg://postgres@localhost/jblr_revert' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_redeploy.log"
          sqitch verify 'db:pg://postgres@localhost/jblr_revert' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/sqitch_redeploy_verify.log"

      - name: Apply and verify functional roles
        run: |
          set -euo pipefail
          cd /tmp/jblr-src
          psql -X -v ON_ERROR_STOP=1 -d jblr_src -f ops/preprod_roles.sql | tee "$GITHUB_WORKSPACE/evidence/roles_apply.log"
          psql -X -d jblr_src -P pager=off -c "select rolname,rolcanlogin,rolsuper,rolcreaterole,rolcreatedb from pg_roles where rolname like 'jblr_db_%' order by 1" | tee "$GITHUB_WORKSPACE/evidence/roles_attributes.txt"
          psql -X -d jblr_src -P pager=off -c "select n.nspname,pg_get_userbyid(n.nspowner) owner from pg_namespace n where n.nspname in ('core','taxonomy','field','material','evidence','governance','analytics','security','migration_staging') order by 1" | tee "$GITHUB_WORKSPACE/evidence/schema_ownership.txt"

      - name: Inventory and C1-C5
        run: |
          set -euo pipefail
          cd /tmp/jblr-src
          psql -X -v ON_ERROR_STOP=1 -d jblr_src -f tests/verify_inventory.sql | tee "$GITHUB_WORKSPACE/evidence/inventory_source.log"
          bash tests/r2_concurrency.sh jblr_src "$GITHUB_WORKSPACE/evidence/c1_c5_source"

      - name: Portable PostgreSQL backup
        run: |
          set -euo pipefail
          pg_dump -Fc -d jblr_src -f evidence/jblr_preprod.dump
          sha256sum evidence/jblr_preprod.dump | tee evidence/jblr_preprod.dump.sha256
          {
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "github_sha=$GITHUB_SHA"
            echo "baseline_sha256=$BASELINE_SHA256"
            pg_dump --version
          } > evidence/backup_manifest.txt

      - name: Real restore into independent clean database
        run: |
          set -euo pipefail
          createdb jblr_restore
          pg_restore --exit-on-error -d jblr_restore evidence/jblr_preprod.dump 2>&1 | tee evidence/restore.log
          cd /tmp/jblr-src
          psql -X -v ON_ERROR_STOP=1 -d jblr_restore -f tests/verify_inventory.sql | tee "$GITHUB_WORKSPACE/evidence/inventory_restore.log"
          psql -X -d jblr_restore -P pager=off -c "select extname,extversion from pg_extension where extname in ('postgis','pg_trgm') order by 1" | tee "$GITHUB_WORKSPACE/evidence/restore_extensions.txt"
          psql -X -d jblr_restore -Atqc "select count(*) from information_schema.tables where table_schema='sqitch'" | tee "$GITHUB_WORKSPACE/evidence/restore_sqitch_registry_table_count.txt"
          psql -X -d jblr_restore -Atqc "select to_regclass('governance.schema_release'),to_regclass('migration_staging.source_file')" | tee "$GITHUB_WORKSPACE/evidence/restore_release_staging.txt"

      - name: Second installation clean from versioned sources
        run: |
          set -euo pipefail
          createdb jblr_clean
          cd /tmp/jblr-src
          echo "$BASELINE_SHA256  db/baseline/JBLR_01_2_R2_DDL_PILOT.sql" | sha256sum -c -
          psql -X -v ON_ERROR_STOP=1 -d jblr_clean -f db/baseline/JBLR_01_2_R2_DDL_PILOT.sql > "$GITHUB_WORKSPACE/evidence/clean_baseline.log"
          cd db/sqitch
          sqitch deploy 'db:pg://postgres@localhost/jblr_clean' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/clean_sqitch_deploy.log"
          sqitch verify 'db:pg://postgres@localhost/jblr_clean' 2>&1 | tee "$GITHUB_WORKSPACE/evidence/clean_sqitch_verify.log"
          cd /tmp/jblr-src
          psql -X -v ON_ERROR_STOP=1 -d jblr_clean -f ops/preprod_roles.sql > "$GITHUB_WORKSPACE/evidence/clean_roles.log"
          psql -X -v ON_ERROR_STOP=1 -d jblr_clean -f tests/verify_inventory.sql | tee "$GITHUB_WORKSPACE/evidence/inventory_clean.log"
          bash tests/r2_concurrency.sh jblr_clean "$GITHUB_WORKSPACE/evidence/c1_c5_clean"

      - name: Compare source restore and clean structural inventories
        run: |
          set -euo pipefail
          for db in jblr_src jblr_restore jblr_clean; do
            psql -X -d "$db" -AtF'|' -c "select table_schema,table_name from information_schema.tables where table_schema in ('core','taxonomy','field','material','evidence','governance','analytics','security','migration_staging','sqitch') order by 1,2" > "evidence/${db}_tables.txt"
            psql -X -d "$db" -AtF'|' -c "select routine_schema,routine_name,routine_type from information_schema.routines where routine_schema in ('core','taxonomy','field','material','evidence','governance','analytics','security','migration_staging') order by 1,2,3" > "evidence/${db}_routines.txt"
          done
          diff -u evidence/jblr_src_tables.txt evidence/jblr_restore_tables.txt | tee evidence/diff_src_restore_tables.txt
          diff -u evidence/jblr_src_tables.txt evidence/jblr_clean_tables.txt | tee evidence/diff_src_clean_tables.txt
          diff -u evidence/jblr_src_routines.txt evidence/jblr_restore_routines.txt | tee evidence/diff_src_restore_routines.txt
          diff -u evidence/jblr_src_routines.txt evidence/jblr_clean_routines.txt | tee evidence/diff_src_clean_routines.txt

      - name: Final evidence manifest
        if: always()
        run: |
          set +e
          sha256sum evidence/* 2>/dev/null | sort > evidence/EVIDENCE_SHA256.txt
          find evidence -maxdepth 2 -type f -printf '%P\n' | sort > evidence/INVENTORY.txt
          printf 'github_sha=%s\nrun_id=%s\nrepository=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_REPOSITORY" > evidence/RUN_IDENTITY.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jblr-01-4r-evidence-${{ github.sha }}
          path: evidence
          if-no-files-found: error
