name: JBLR 06 EIDOS TAXONOMIC LAYER CONTROLLED PILOT V2

on:
  workflow_dispatch:
  push:
    branches:
      - 06-taxonomic-genus-reconciliation-v3
    paths:
      - 'app/data/taxonomy/eidos-controlled-pilot-trigger-v2.txt'

permissions:
  contents: write

concurrency:
  group: jblr-06-eidos-taxonomic-layer-controlled-pilot-v2
  cancel-in-progress: false

jobs:
  eidos-controlled-pilot-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EIDOS_PILOT_OUT: artifacts/eidos_taxonomic_layer_pilot_v2
    steps:
      - name: Checkout actor 06 branch
        uses: actions/checkout@v4
        with:
          ref: 06-taxonomic-genus-reconciliation-v3
      - name: Install dependency
        run: python3 -m pip install requests
      - name: Execute corrected controlled EIDOS pilot
        id: pilot
        continue-on-error: true
        run: python3 app/scripts/eidos-taxonomic-layer-controlled-pilot-v2.py
      - name: Materialize pilot evidence
        if: always()
        shell: bash
        run: |
          TARGET='evidence/06_stimes/eidos_taxonomic_layer_controlled_pilot_v2/latest'
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          if [ -f "$EIDOS_PILOT_OUT/EIDOS_TAXONOMIC_LAYER_CONTROLLED_PILOT_V2.json" ]; then
            cp "$EIDOS_PILOT_OUT/EIDOS_TAXONOMIC_LAYER_CONTROLLED_PILOT_V2.json" "$TARGET/"
          elif [ -f "$EIDOS_PILOT_OUT/EIDOS_TAXONOMIC_LAYER_CONTROLLED_PILOT_V1.json" ]; then
            cp "$EIDOS_PILOT_OUT/EIDOS_TAXONOMIC_LAYER_CONTROLLED_PILOT_V1.json" "$TARGET/EIDOS_TAXONOMIC_LAYER_CONTROLLED_PILOT_V2.json"
          else
            printf '%s\n' '{"pilot_id":"EIDOS_TAXONOMIC_LAYER_CONTROLLED_PILOT_v2","overall":"EXECUTION_ARTIFACT_MISSING","global_rematerialization_allowed":false}' > "$TARGET/EIDOS_TAXONOMIC_LAYER_CONTROLLED_PILOT_V2.json"
          fi
          printf '%s\n' \
            "github_run_id=${GITHUB_RUN_ID}" \
            "source_commit=${GITHUB_SHA}" \
            'authority=MITECO_IEPNB_EIDOS' \
            'endpoint=https://datos.iepnb.es/sparql' \
            'fix=HYBRID_X_TOKEN_IS_STRUCTURAL_MARKER_NOT_SPECIFIC_EPITHET' \
            'canonical_field_directive=JBLR-EVT-0000-20260820-TAXONOMIC-FIELDS-001' \
            'canonical_execution_directive=JBLR-EVT-0000-20260820-TAXONOMIC-EXEC-001' \
            > "$TARGET/RUN_METADATA.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo 'No corrected pilot evidence change to commit'
          else
            git commit -m 'Materialize corrected EIDOS taxonomic pilot v2 [skip ci]'
            git push origin HEAD:06-taxonomic-genus-reconciliation-v3
          fi
      - name: Enforce pilot PASS gate
        if: steps.pilot.outcome != 'success'
        run: |
          echo 'Corrected controlled EIDOS pilot did not PASS. Global rematerialization remains blocked.'
          exit 5
      - name: Upload pilot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EIDOS_TAXONOMIC_LAYER_CONTROLLED_PILOT_V2
          path: artifacts/eidos_taxonomic_layer_pilot_v2/
          if-no-files-found: warn
          retention-days: 30
