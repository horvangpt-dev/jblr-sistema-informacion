name: 08 Modelo 3 T1 synthetic QA

on:
  push:
    branches:
      - 08-modelo3-t1-synthetic-v1
    paths:
      - 'execution/08/model3-t1-synthetic-v1/**'
      - '.github/workflows/08-modelo3-t1-synthetic.yml'
  workflow_dispatch:

jobs:
  synthetic-t1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run F01-F17
        working-directory: execution/08/model3-t1-synthetic-v1
        run: python run_fixtures.py
      - name: Run contract tests
        working-directory: execution/08/model3-t1-synthetic-v1
        run: python -m unittest discover -s tests -v
