name: 08 Corpus B source expansion QA
on:
  push:
    branches:
      - 08-corpus-b-source-expansion-v1
    paths:
      - 'execution/08/corpus-b-source-expansion-v1/**'
      - '.github/workflows/08-corpus-b-source-expansion-qa.yml'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source-expansion controlled QA
        working-directory: execution/08/corpus-b-source-expansion-v1
        run: npm test
