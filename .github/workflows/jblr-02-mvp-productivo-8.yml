name: JBLR 02 MVP Productivo 8 STAGING

on:
  push:
    branches: [02-mvp-productivo-8]
    paths:
      - 'app/**'
      - '.github/workflows/jblr-02-mvp-productivo-8.yml'
  workflow_dispatch:

concurrency:
  group: jblr-02-mvp-productivo-8-staging
  cancel-in-progress: true

jobs:
  mvp8-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: ${{ secrets.JBLR_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package.json
      - name: Fail closed if STAGING secret is absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then echo 'STAGING_SECRET_PRESENT=NO'; exit 78; fi
          echo 'STAGING_SECRET_PRESENT=YES'
      - name: Initialize evidence directory
        run: mkdir -p evidence
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure baseline STAGING taxon demonstration data
        run: npm run seed:staging
      - name: Install Chromium for responsive UI test
        run: npx playwright install --with-deps chromium
      - name: Start MVP server
        shell: bash
        run: |
          set -euo pipefail
          npm start > evidence/server.log 2>&1 &
          echo $! > /tmp/jblr_mvp8_pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat evidence/server.log
          exit 1
      - name: Run desktop, mobile and individual traceability E2E
        shell: bash
        env:
          MVP_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm run test:ui | tee evidence/ui-status.txt
      - name: Verify persisted Individual traceability state in Neon
        shell: bash
        run: |
          set -euo pipefail
          npm run test:individual-traceability-state | tee evidence/individual-traceability-state.txt
      - name: Verify MVP8 did not change the certified schema files
        shell: bash
        run: |
          set -euo pipefail
          git -C .. diff --quiet 4ca362d359ddd99b5846089b4efcf633976ba372 HEAD -- db
          echo 'SCHEMA_CHANGES=NONE' | tee evidence/schema-changes.txt
      - name: Verify no client/database secret material is versioned
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'npg_[A-Za-z0-9]+|postgresql://[^:[:space:]]+:[^@[:space:]]+@' public src scripts tests README.md .env.example --exclude='.env.example'
          ! grep -R -n 'DATABASE_URL' public
          echo 'NO_CLIENT_DATABASE_SECRET=PASS' | tee evidence/no-client-secret.txt
      - name: Write minimal MVP8 status evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'OPEN_POPULATION_INDIVIDUALS=PASS'
            echo 'CREATE_INDIVIDUAL=PASS'
            echo 'LINK_INDIVIDUAL_POPULATION=PASS'
            echo 'OPEN_INDIVIDUAL_DETAIL=PASS'
            echo 'EDIT_INDIVIDUAL=PASS'
            echo 'OPEN_COLLECTION_INDIVIDUALS=PASS'
            echo 'LINK_COLLECTION_INDIVIDUAL=PASS'
            echo 'SHOW_COLLECTION_INDIVIDUAL_ROLE=PASS'
            echo 'LINK_SAMPLE_ORIGIN_INDIVIDUAL=PASS'
            echo 'TRACE_SAMPLE_TO_INDIVIDUAL=PASS'
            echo 'TRACE_SAMPLE_TO_COLLECTION_EVENT=PASS'
            echo 'TRACE_INDIVIDUAL_TO_POPULATION=PASS'
            echo 'PERSIST_INDIVIDUAL_TRACEABILITY_TO_NEON=PASS'
            echo 'MOBILE_INDIVIDUAL_UI=PASS'
            echo 'NO_CLIENT_DATABASE_SECRET=PASS'
            echo 'PHOTOS_DOCUMENTS=DEFERRED_UNTIL_PERSISTENT_FILE_STORAGE_SLICE'
            echo 'SCHEMA_CHANGES=NONE'
          } | tee evidence/MVP_PRODUCTIVO_8_STATUS.txt
      - name: Upload minimal non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jblr-02-mvp-productivo-8-evidence
          path: app/evidence/
          if-no-files-found: warn
