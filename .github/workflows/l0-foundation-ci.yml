name: L0 foundation CI

on:
  push:
    branches:
      - l0-software-foundation-20260826
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements/l0.lock'
      - 'pyproject.toml'
      - '.github/workflows/l0-foundation-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements/l0.lock'
      - 'pyproject.toml'
      - '.github/workflows/l0-foundation-ci.yml'

permissions:
  contents: read

jobs:
  python-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/l0.lock
      - name: Install locked L0 dependencies
        run: python -m pip install -r requirements/l0.lock
      - name: Run L0 tests
        run: python -m pytest
