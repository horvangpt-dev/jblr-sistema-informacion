name: JBLR STIME00 Corrected Reexecution Override

on:
  push:
    branches:
      - 09-stime00-execution-run-1
    paths:
      - '.github/workflows/jblr-stime00-reexecution-override.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPECTED_MEMBERSHIP_SHA256: 1a2727c410dd0a016973df88de19934cf656ad808b87357d6fe95aee47914265
  EXPECTED_EXECUTOR_SHA256: 49b84bafc49228b570eae0d3f0e10121746945e9af4b5903ddf547ee3390a221

jobs:
  corrected-reexecution:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact actor-09 ref
        uses: actions/checkout@v4
        with:
          ref: 09-stime00-execution-run-1
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct RC2 and decode corrected executors
        shell: bash
        run: |
          set -euo pipefail
          cat execution/09/stime00/membership_parts/part*.b64 > execution/09/stime00/membership_rc2.jsonl.gz.b64
          base64 -d execution/09/stime00/stime00_full_corpus.py.gz.b64 | gzip -d > execution/09/stime00/stime00_full_corpus.py
          base64 -d execution/09/stime00/stime00_reexecution_v3.py.gz.b64 | gzip -d > execution/09/stime00/stime00_reexecution_v3.py
          python -m py_compile execution/09/stime00/stime00_full_corpus.py execution/09/stime00/stime00_reexecution_v3.py
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,os
          p=Path('execution/09/stime00/membership_rc2.jsonl.gz.b64')
          raw=gzip.decompress(base64.b64decode(p.read_text().strip()))
          got=hashlib.sha256(raw).hexdigest()
          assert got == os.environ['EXPECTED_MEMBERSHIP_SHA256'], (got, os.environ['EXPECTED_MEMBERSHIP_SHA256'])
          assert sum(1 for x in raw.decode().splitlines() if x.strip()) == 2210
          corrected=Path('execution/09/stime00/stime00_reexecution_v3.py').read_bytes()
          got2=hashlib.sha256(corrected).hexdigest()
          assert got2 == os.environ['EXPECTED_EXECUTOR_SHA256'], (got2, os.environ['EXPECTED_EXECUTOR_SHA256'])
          print('RC2 membership preflight PASS')
          print('Corrected executor SHA256 PASS')
          PY

      - name: Upload corrected source audit
        uses: actions/upload-artifact@v4
        with:
          name: JBLR_STIME00_REEXECUTION_V3_SOURCE_AUDIT
          path: |
            execution/09/stime00/stime00_full_corpus.py
            execution/09/stime00/stime00_reexecution_v3.py
          retention-days: 30

      - name: Execute corrected STIME00 corpus
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          rm -rf stime00_output
          python execution/09/stime00/stime00_reexecution_v3.py

      - name: Upload corrected execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JBLR_STIME00_ACTOR09_REEXECUTION_v2
          path: stime00_output/
          if-no-files-found: warn
          retention-days: 30

      - name: Write auditable run receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p execution/09/stime00/reexecution_status
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path('stime00_output')
          files={}
          if out.exists():
              for p in sorted(out.iterdir()):
                  if p.is_file():
                      files[p.name]={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size}
          receipt={
              'run_id': int(os.environ['RUN_ID']),
              'run_attempt': int(os.environ['RUN_ATTEMPT']),
              'trigger_sha': os.environ['TRIGGER_SHA'],
              'job_status': os.environ['JOB_STATUS'],
              'actor':'09',
              'stime':'STIME_00_REVISION_TAXONOMICA',
              'user_direct_override':True,
              'rc2_membership_sha256':os.environ['EXPECTED_MEMBERSHIP_SHA256'],
              'corrected_executor_sha256':os.environ['EXPECTED_EXECUTOR_SHA256'],
              'artifact_name':'JBLR_STIME00_ACTOR09_REEXECUTION_v2',
              'source_artifact_name':'JBLR_STIME00_REEXECUTION_V3_SOURCE_AUDIT',
              'output_files':files,
              'rc2_mutated':False,
              'neon_writes':0,
              'stime_closed':False,
          }
          dst=Path('execution/09/stime00/reexecution_status/CURRENT_CORRECTED_RUN.json')
          dst.write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          Path(f"execution/09/stime00/reexecution_status/RUN_{receipt['run_id']}.json").write_text(json.dumps(receipt,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- execution/09/stime00/reexecution_status/CURRENT_CORRECTED_RUN.json execution/09/stime00/reexecution_status/RUN_${RUN_ID}.json
          if git diff --cached --quiet; then
            echo 'No receipt changes to commit'
          else
            git commit -m "chore(09): record corrected STIME00 run ${RUN_ID}"
            git push origin HEAD:09-stime00-execution-run-1
          fi
