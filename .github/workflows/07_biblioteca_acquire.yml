name: JBLR 07 Biblioteca Acquire

on:
  push:
    branches:
      - 07-biblioteca-index
    paths:
      - 'library/07_biblioteca/acquisition/acquire_rjb.py'
      - 'library/07_biblioteca/acquisition/rjb_targets_batch01.json'
  workflow_dispatch:

concurrency:
  group: 07-biblioteca-acquire
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Acquire RJB corpus
        shell: bash
        run: |
          set -euo pipefail
          python library/07_biblioteca/acquisition/acquire_rjb.py

      - name: List acquired files
        run: |
          find acquired -maxdepth 3 -type f -printf '%p\t%s bytes\n' | sort

      - name: Upload acquisition artifact
        uses: actions/upload-artifact@v4
        with:
          name: JBLR_07_RJB_ACQUISITION
          path: acquired/
          if-no-files-found: error
          retention-days: 7
