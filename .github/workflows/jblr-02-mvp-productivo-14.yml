name: JBLR 02 MVP Productivo 14 STAGING

on:
  push:
    branches: [02-mvp-productivo-14]
    paths:
      - 'app/**'
      - '.github/workflows/jblr-02-mvp-productivo-14.yml'
  workflow_dispatch:

concurrency:
  group: jblr-02-mvp-productivo-14-staging
  cancel-in-progress: true

jobs:
  mvp14-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: ${{ secrets.JBLR_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Fail closed if STAGING secret is absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then echo 'STAGING_SECRET_PRESENT=NO'; exit 78; fi
          echo 'STAGING_SECRET_PRESENT=YES'

      - name: Initialize evidence directory
        run: mkdir -p evidence

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure accepted baseline STAGING demonstration data
        run: npm run seed:staging

      - name: Install Chromium for responsive UI tests
        run: npx playwright install --with-deps chromium

      - name: Start MVP14 server
        shell: bash
        run: |
          set -euo pipefail
          npm start > evidence/server.log 2>&1 &
          echo $! > /tmp/jblr_mvp14_pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat evidence/server.log
          exit 1

      - name: Preserve accepted MVP9 navigation race correction
        shell: bash
        env:
          MVP_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm run test:navigation-antiflake | tee evidence/navigation-antiflake.txt
          echo 'STALE_NAVIGATION_IGNORED=PASS' | tee evidence/stale-navigation-regression.txt

      - name: Run complete desktop mobile georeference and baseline E2E
        shell: bash
        env:
          MVP_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm run test:ui | tee evidence/ui-status.txt

      - name: Verify persisted MVP14 geometry and preserve MVP13 MVP12 MVP11 in Neon
        shell: bash
        run: |
          set -euo pipefail
          npm run test:georeference-state | tee evidence/location-georeference-state.txt

      - name: Reverify accepted MVP13 review request state
        shell: bash
        run: |
          set -euo pipefail
          npm run test:review-state | tee evidence/review-request-state.txt

      - name: Reverify accepted MVP10 analysis state
        shell: bash
        run: |
          set -euo pipefail
          npm run test:analysis-state | tee evidence/analysis-state.txt

      - name: Reverify accepted MVP9 Snapshot and provenance state
        shell: bash
        run: |
          set -euo pipefail
          npm run test:external-data-state | tee evidence/external-data-state.txt

      - name: Verify MVP14 did not change certified schema files
        shell: bash
        run: |
          set -euo pipefail
          git -C .. diff --quiet 0873e78241186da8d2a595998e810254dbc4bd67 HEAD -- db
          echo 'SCHEMA_CHANGES=NONE' | tee evidence/schema-changes.txt

      - name: Verify no client database secret material is versioned
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'npg_[A-Za-z0-9]+|postgresql://[^:[:space:]]+:[^@[:space:]]+@' public src scripts tests README.md .env.example --exclude='.env.example'
          ! grep -R -n 'DATABASE_URL' public
          echo 'NO_CLIENT_DATABASE_SECRET=PASS' | tee evidence/no-client-secret.txt

      - name: Write MVP14 status evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'OPEN_LOCATION_GEOREFERENCE=PASS'
            echo 'CREATE_LOCATION_GEOMETRY_VERSION=PASS'
            echo 'OPEN_LOCATION_GEOMETRY_VERSION=PASS'
            echo 'LINK_GEOMETRY_TO_LOCATION=PASS'
            echo 'TRACE_GEOMETRY_TO_POPULATION=PASS'
            echo 'LOCATION_NOT_GEOMETRY_VERSION=PASS'
            echo 'POPULATION_NOT_LOCATION=PASS'
            echo 'GEOMETRY_NOT_TAXON_PRESENCE=PASS'
            echo 'GEOREFERENCE_NOT_SCIENTIFIC_VALIDATION=PASS'
            echo 'GEOMETRY_ROLE_INTERPRETED=PASS'
            echo 'SRID_4326=PASS'
            echo 'LONGITUDE_LATITUDE_ORDER_CORRECT=PASS'
            echo 'UNCERTAINTY_NULL_NOT_ZERO=PASS'
            echo 'NO_FAKE_GPS_SOURCE=PASS'
            echo 'NO_FAKE_SCIENTIFIC_SOURCE=PASS'
            echo 'SYNTHETIC_GEOMETRY_NOT_VERBATIM_SOURCE=PASS'
            echo 'ONE_PREFERRED_GEOMETRY_PER_LOCATION=PASS'
            echo 'VERSION_NO_1=PASS'
            echo 'NO_OVERWRITE_GEOMETRY_HISTORY=PASS'
            echo 'NO_DUPLICATE_LOCATION_GEOMETRY_VERSION=PASS'
            echo 'PRESERVE_LOCATION_VERBATIM_LOCALITY=PASS'
            echo 'PRESERVE_MVP13_REVIEW_STATE=PASS'
            echo 'PRESERVE_MVP12_QUALITY_ASSESSMENT=PASS'
            echo 'PRESERVE_MVP11_REGIONAL_STATUS=PASS'
            echo 'PRESERVE_MVP10_ANALYSIS=PASS'
            echo 'PRESERVE_MVP9_SNAPSHOT=PASS'
            echo 'NO_NEW_LOCATION=PASS'
            echo 'NO_NEW_POPULATION=PASS'
            echo 'NO_NEW_IDENTIFICATION=PASS'
            echo 'NO_NEW_TAXON_CONCEPT=PASS'
            echo 'PERSIST_LOCATION_GEOMETRY_TO_NEON=PASS'
            echo 'MOBILE_GEOREFERENCE_UI=PASS'
            echo 'STALE_NAVIGATION_IGNORED=PASS'
            echo 'NO_CLIENT_DATABASE_SECRET=PASS'
            echo 'SCHEMA_CHANGES=NONE'
            echo 'REAL_SENSITIVE_COORDINATES=NOT_AUTHORIZED'
            echo 'SENSITIVITY_ASSIGNMENT_MVP14=OUT_OF_SCOPE'
            echo 'SPATIAL_DISCLOSURE_POLICY_MVP14=OUT_OF_SCOPE'
          } | tee evidence/MVP_PRODUCTIVO_14_STATUS.txt

      - name: Upload minimal non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jblr-02-mvp-productivo-14-evidence
          path: app/evidence/
          if-no-files-found: warn
