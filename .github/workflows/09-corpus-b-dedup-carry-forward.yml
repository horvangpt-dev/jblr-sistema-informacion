name: 09 Corpus B deduplicated carry-forward

on:
  push:
    branches:
      - 09-corpus-b-spanish-synonymy-eidos-deep-v1
    paths:
      - 'execution/09/corpus-b-source-expansion-v1/spanish-deep/RUN_REQUEST_CARRY_FORWARD_DEDUP.json'

permissions:
  contents: write

jobs:
  carry-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09-corpus-b-spanish-synonymy-eidos-deep-v1
          fetch-depth: 1
      - name: Validate request
        run: |
          python - <<'PY'
          import json
          p=json.load(open('execution/09/corpus-b-source-expansion-v1/spanish-deep/RUN_REQUEST_CARRY_FORWARD_DEDUP.json'))
          assert p['enabled'] is True and p['sourceQueueRows']==337
          assert p['crossWithA'] is False and p['neonWrites']==0 and p['corpusBFreeze'] is False
          assert p['gateEvent']=='JBLR-EVT-0000-20260824-ACCEPT-09-DEEP-SPANISH-BATCH02-V2-001'
          PY
      - name: Build deduplicated carry-forward receipt
        run: |
          set -euo pipefail
          ROOT=execution/09/corpus-b-source-expansion-v1/spanish-deep
          QUEUE=execution/09/corpus-b-cold-start-v1/runs/09_CORPUS_B_COLD_START_20260824_002/CORPUS_B_338_RESOLUTION_RESULTS_v2.json
          BATCH=$ROOT/runs/SPANISH_RELATIONS_EIDOS_BATCH_02_20260824_002/RUN_RECEIPT.json
          OUT=$ROOT/runs/CORPUS_B_DEDUP_CARRY_FORWARD_20260824_001/CARRY_FORWARD_RECEIPT.json
          python $ROOT/make_deduplicated_carry_forward.py "$QUEUE" "$BATCH" "$OUT"
      - name: QA invariants and persist
        run: |
          set -euo pipefail
          OUT=execution/09/corpus-b-source-expansion-v1/spanish-deep/runs/CORPUS_B_DEDUP_CARRY_FORWARD_20260824_001
          python - <<'PY'
          import json
          p='execution/09/corpus-b-source-expansion-v1/spanish-deep/runs/CORPUS_B_DEDUP_CARRY_FORWARD_20260824_001/CARRY_FORWARD_RECEIPT.json'
          r=json.load(open(p))
          assert r['sourceQueueRows']==337
          assert r['sourceQueueRows']==r['uniqueResolvedSourceRecords']+r['remainingCarryForwardRows']
          assert r['crossWithA'] is False and r['neonWrites']==0 and r['corpusBFreeze'] is False
          assert r['noFuzzy'] is True and r['noParentIdInheritance'] is True and r['noRankCollapse'] is True
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin 09-corpus-b-spanish-synonymy-eidos-deep-v1
          git add "$OUT"
          git commit -m "evidence(09): deduplicated carry-forward after batch02 v2 ${GITHUB_RUN_ID}"
          git push origin HEAD:09-corpus-b-spanish-synonymy-eidos-deep-v1
