name: JBLR 02 MVP Productivo 15 STAGING

on:
  push:
    branches: [02-mvp-productivo-15]
    paths:
      - 'app/**'
      - '.github/workflows/jblr-02-mvp-productivo-15.yml'
  workflow_dispatch:

concurrency:
  group: jblr-02-mvp-productivo-15-staging
  cancel-in-progress: true

jobs:
  mvp15-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: ${{ secrets.JBLR_STAGING_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Fail closed if STAGING secret is absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then echo 'STAGING_SECRET_PRESENT=NO'; exit 78; fi
          echo 'STAGING_SECRET_PRESENT=YES'

      - name: Initialize evidence directory
        run: mkdir -p evidence

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure accepted baseline STAGING demonstration data
        run: npm run seed:staging

      - name: Install Chromium for responsive UI tests
        run: npx playwright install --with-deps chromium

      - name: Start MVP15 server
        shell: bash
        run: |
          set -euo pipefail
          npm start > evidence/server.log 2>&1 &
          echo $! > /tmp/jblr_mvp15_pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat evidence/server.log
          exit 1

      - name: Preserve accepted navigation antiflake baseline
        shell: bash
        env:
          MVP_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm run test:navigation-antiflake | tee evidence/navigation-antiflake.txt
          echo 'STALE_NAVIGATION_IGNORED=PASS' | tee evidence/stale-navigation-regression.txt

      - name: Run complete desktop mobile external-reference and baseline E2E
        shell: bash
        env:
          MVP_BASE_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm run test:ui | tee evidence/ui-status.txt

      - name: Verify persisted MVP15 external taxon reference and preservation
        shell: bash
        run: |
          set -euo pipefail
          npm run test:external-taxon-reference-state | tee evidence/external-taxon-reference-state.txt

      - name: Reverify accepted MVP14 georeference state
        shell: bash
        run: |
          set -euo pipefail
          npm run test:georeference-state | tee evidence/location-georeference-state.txt

      - name: Reverify accepted MVP13 review request state
        shell: bash
        run: |
          set -euo pipefail
          npm run test:review-state | tee evidence/review-request-state.txt

      - name: Reverify accepted MVP12 quality state
        shell: bash
        run: |
          set -euo pipefail
          npm run test:quality-state | tee evidence/quality-review-state.txt

      - name: Reverify accepted MVP10 analysis state
        shell: bash
        run: |
          set -euo pipefail
          npm run test:analysis-state | tee evidence/analysis-state.txt

      - name: Reverify accepted MVP9 external data state
        shell: bash
        run: |
          set -euo pipefail
          npm run test:external-data-state | tee evidence/external-data-state.txt

      - name: Verify MVP15 did not change certified schema files
        shell: bash
        run: |
          set -euo pipefail
          git -C .. diff --quiet 639ce447640f2259407b0ae5e88f35f3a5defc5d HEAD -- db
          echo 'SCHEMA_CHANGES=NONE' | tee evidence/schema-changes.txt

      - name: Verify no client database secret material is versioned
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'npg_[A-Za-z0-9]+|postgresql://[^:[:space:]]+:[^@[:space:]]+@' public src scripts tests README.md .env.example --exclude='.env.example'
          ! grep -R -n 'DATABASE_URL' public
          echo 'NO_CLIENT_DATABASE_SECRET=PASS' | tee evidence/no-client-secret.txt

      - name: Write MVP15 status evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'OPEN_EXTERNAL_TAXON_REFERENCES=PASS'
            echo 'CREATE_EXTERNAL_TAXON_REFERENCE=PASS'
            echo 'OPEN_EXTERNAL_TAXON_REFERENCE=PASS'
            echo 'LINK_REFERENCE_TO_TAXON_CONCEPT=PASS'
            echo 'LINK_REFERENCE_TO_EXTERNAL_SOURCE=PASS'
            echo 'TRACE_REFERENCE_TO_TAXON_CONCEPT=PASS'
            echo 'TRACE_REFERENCE_TO_EXTERNAL_SOURCE=PASS'
            echo 'EXTERNAL_REFERENCE_NOT_TAXON_CONCEPT=PASS'
            echo 'EXTERNAL_REFERENCE_NOT_TAXONOMIC_NAME=PASS'
            echo 'EXTERNAL_IDENTIFIER_NOT_TAXONOMIC_IDENTITY=PASS'
            echo 'EXTERNAL_IDENTIFIER_NOT_IDENTIFICATION=PASS'
            echo 'EXTERNAL_REFERENCE_NOT_SCIENTIFIC_VALIDATION=PASS'
            echo 'EXTERNAL_SOURCE_NOT_VALIDATED_AUTHORITY=PASS'
            echo 'REFERENCE_NOT_ASSERTION=PASS'
            echo 'IMPORT_NOT_VALIDATION=PASS'
            echo 'TAXONOMIC_NAME_NULL_PRESERVED=PASS'
            echo 'BACKBONE_SNAPSHOT_NULL_PRESERVED=PASS'
            echo 'EXTERNAL_URL_NULL_PRESERVED=PASS'
            echo 'MATCH_TYPE_NULL_PRESERVED=PASS'
            echo 'CONFIDENCE_NULL_NOT_ZERO=PASS'
            echo 'NO_REAL_EXTERNAL_IDENTIFIER=PASS'
            echo 'NO_NEW_EXTERNAL_SOURCE=PASS'
            echo 'NO_NEW_IDENTIFICATION=PASS'
            echo 'NO_NEW_TAXON_CONCEPT=PASS'
            echo 'NO_NEW_TAXONOMIC_NAME=PASS'
            echo 'NO_DUPLICATE_EXTERNAL_TAXON_REFERENCE=PASS'
            echo 'REPEAT_DOES_NOT_CHANGE_EXTERNAL_REFERENCE=PASS'
            echo 'PRESERVE_MVP14_GEOREFERENCE=PASS'
            echo 'PRESERVE_MVP13_REVIEW_STATE=PASS'
            echo 'PRESERVE_MVP12_QUALITY_ASSESSMENT=PASS'
            echo 'PRESERVE_MVP10_ANALYSIS=PASS'
            echo 'PRESERVE_MVP9_EXTERNAL_DATA=PASS'
            echo 'PERSIST_EXTERNAL_TAXON_REFERENCE_TO_NEON=PASS'
            echo 'MOBILE_EXTERNAL_TAXON_REFERENCE_UI=PASS'
            echo 'STALE_NAVIGATION_IGNORED=PASS'
            echo 'NO_CLIENT_DATABASE_SECRET=PASS'
            echo 'SCHEMA_CHANGES=NONE'
            echo 'REAL_EXTERNAL_TAXON_IDENTIFIER=NOT_AUTHORIZED_FOR_MVP15'
          } | tee evidence/MVP_PRODUCTIVO_15_STATUS.txt

      - name: Upload minimal non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jblr-02-mvp-productivo-15-evidence
          path: app/evidence/
          if-no-files-found: warn
