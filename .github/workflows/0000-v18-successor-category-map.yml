name: 0000 v18 successor category map
on:
  push:
    branches: [0000-v17-successor-rioja-2262]
    paths:
      - execution/0000/v18/successor-rioja-2262/EXECUTE_CATEGORY_MAP.json
jobs:
  category-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0000-v17-successor-rioja-2262
          fetch-depth: 0
      - name: Validate trigger
        run: |
          python - <<'PY'
          import json
          p='execution/0000/v18/successor-rioja-2262/EXECUTE_CATEGORY_MAP.json'
          x=json.load(open(p))
          assert x['execute'] is True
          assert x['scope']==309
          assert x['repeatPreflight'] is False
          assert x['rc2Mutation']==0
          assert x['stimes']=='HOLD'
          PY
      - name: Build compact category map
        run: python execution/0000/v18/successor-rioja-2262/build_category_map.py
      - name: Commit category map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add execution/0000/v18/successor-rioja-2262/CATEGORY_MAP_309_COMPACT.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence(0000-v18): compact final 309 category map $GITHUB_RUN_ID"
            git push
          fi
