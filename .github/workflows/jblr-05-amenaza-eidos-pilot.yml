name: JBLR 05 Amenaza EIDOS Pilot

on:
  push:
    branches:
      - 05-motores-analiticos-botanicos
    paths:
      - '.github/workflows/jblr-05-amenaza-eidos-pilot.yml'
      - 'ops/05/amenaza_eidos.py'
      - 'data/05/universe.parts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eidos-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify canonical taxon universe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, re
          target = '3a0f9badf84a6798d01f0b5f3c01d72875d28f852db0b2ec49592bccfb2f31e4'
          parts = sorted(pathlib.Path('data/05/universe.parts').glob('part*.b64'))
          assert len(parts) == 9, f'expected 9 parts, got {len(parts)}'
          texts = [re.sub(r'\s+', '', p.read_text(encoding='ascii')) for p in parts]
          compact = ''.join(texts)
          bad = sorted(set(re.sub(r'[A-Za-z0-9+/=]', '', compact)))
          assert not bad, f'invalid base64 characters: {bad!r}'

          candidates = []
          if len(compact) % 4 == 0:
              candidates.append(('direct', compact))
          elif len(compact) % 4 == 1 and len(texts[0]) == 5001:
              tail = ''.join(texts[1:])
              for i in range(len(texts[0])):
                  candidates.append((f'part00_delete_index_{i}', texts[0][:i] + texts[0][i+1:] + tail))
          else:
              raise AssertionError(f'unexpected base64 lengths total={len(compact)} part00={len(texts[0])}')

          matches = []
          for label, candidate in candidates:
              try:
                  raw_gz = base64.b64decode(candidate, validate=True)
                  raw_csv = gzip.decompress(raw_gz)
              except Exception:
                  continue
              digest = hashlib.sha256(raw_csv).hexdigest()
              if digest == target:
                  matches.append((label, raw_csv))

          assert len(matches) == 1, f'canonical reconstruction matches={len(matches)} labels={[x[0] for x in matches]}'
          label, raw_csv = matches[0]
          out = pathlib.Path('data/05/taxon_universe.csv')
          out.write_bytes(raw_csv)
          rows = raw_csv.count(b'\n') - 1
          assert rows == 2742, rows
          print('TAXON_UNIVERSE_RECONSTRUCTION=' + label)
          print('TAXON_UNIVERSE_INTEGRITY=PASS')
          print('TAXON_UNIVERSE_ROWS=2742')
          print('TAXON_UNIVERSE_SHA256=' + target)
          PY
          head -n 3 data/05/taxon_universe.csv
          tail -n 3 data/05/taxon_universe.csv

      - name: Syntax check collector
        run: python -m py_compile ops/05/amenaza_eidos.py

      - name: Pilot first window
        run: python ops/05/amenaza_eidos.py --universe data/05/taxon_universe.csv --out out/05/amenaza/pilot-first --start 1 --limit 12 --pause 0.10

      - name: Pilot Androsace window
        run: python ops/05/amenaza_eidos.py --universe data/05/taxon_universe.csv --out out/05/amenaza/pilot-androsace --start 130 --limit 12 --pause 0.10

      - name: Validate evidence-only invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json
          from pathlib import Path
          allowed = {'VALID_SOURCE_EVIDENCE','NO_EVALUATION_FOUND_IN_EIDOS','TAXON_UNRESOLVED','SOURCE_ERROR'}
          for d in [Path('out/05/amenaza/pilot-first'), Path('out/05/amenaza/pilot-androsace')]:
              m = json.loads((d/'run_manifest.json').read_text(encoding='utf-8'))
              assert m['scoring_performed'] is False
              assert m['absence_inference_performed'] is False
              rows = list(csv.DictReader((d/'taxon_summary.csv').open(encoding='utf-8-sig')))
              assert len(rows) == 12
              assert all(r['evidence_state'] in allowed for r in rows)
          print('EVIDENCE_ONLY_INVARIANTS=PASS')
          PY

      - name: Upload pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: jblr-05-amenaza-eidos-pilot
          path: out/05/amenaza/
          if-no-files-found: error
          retention-days: 30
