name: JBLR TAXONOMIC REALITY 1259 V5 WFO API

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 06-stimes-banco-semillas
    paths:
      - 'app/data/stimes/amenaza/taxonomic-reality-1259-v5-trigger.txt'

permissions:
  contents: write

concurrency:
  group: jblr-taxonomic-reality-1259-v5
  cancel-in-progress: false

jobs:
  taxonomic-reality-1259-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TAXON_REALITY_OUT: artifacts/taxonomic_reality_1259_v5
      WFO_API_WAIT: '0.55'
    steps:
      - name: Checkout canonical actor branch
        uses: actions/checkout@v4
        with:
          ref: 06-stimes-banco-semillas

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests

      - name: Execute preflight and full 1259-taxon three-source reality filter
        run: python3 app/scripts/taxonomic-reality-protocol-1259-v5.py

      - name: Materialize auditable phase-1 results
        if: success()
        shell: bash
        run: |
          TARGET='evidence/06_stimes/taxonomic_reality_1259_v5/latest'
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp "$TAXON_REALITY_OUT/TAXONOMIC_REALITY_PREFLIGHT_V5.json" "$TARGET/"
          cp "$TAXON_REALITY_OUT/TAXONOMIC_REALITY_1259_RESULTS_V5.csv" "$TARGET/"
          cp "$TAXON_REALITY_OUT/TAXONOMIC_REALITY_NO_RESPONSE_ALL_THREE_V5.csv" "$TARGET/"
          cp "$TAXON_REALITY_OUT/TAXONOMIC_REALITY_SOURCE_INCOMPLETE_V5.csv" "$TARGET/"
          cp "$TAXON_REALITY_OUT/TAXONOMIC_REALITY_REVIEW_REQUIRED_V5.csv" "$TARGET/"
          cp "$TAXON_REALITY_OUT/TAXONOMIC_REALITY_1259_QA_V5.json" "$TARGET/"
          printf '%s\n' \
            "github_run_id=${GITHUB_RUN_ID}" \
            "source_commit=${GITHUB_SHA}" \
            'scope=IUCN_PROBLEM_CASES_1259' \
            'sources=POWO_WCVP_OFFICIAL_DWCA,WFO_OFFICIAL_GRAPHQL_API,ANTHOS_RJB_CSIC_OFFICIAL_DWCA' \
            'phase=EXACT_TAXON_RESPONSE_REALITY_FILTER' \
            'automatic_deletion=NO' \
            > "$TARGET/RUN_METADATA.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo 'No result change to commit'
          else
            git commit -m 'Materialize taxonomic reality v5 for 1259 IUCN problem taxa [skip ci]'
            git push origin HEAD:06-stimes-banco-semillas
          fi

      - name: Upload execution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TAXONOMIC_REALITY_1259_V5_WFO_API
          path: artifacts/taxonomic_reality_1259_v5/
          if-no-files-found: warn
          retention-days: 30
