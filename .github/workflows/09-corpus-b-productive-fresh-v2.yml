name: 09 STIME00 RC3 limited productive recovery

on:
  push:
    branches:
      - 09-stime00-rc3-limited-productive-v1
    paths:
      - 'execution/09/stime00-rc3-limited-v1/RUN_REQUEST.json'

permissions:
  contents: write

jobs:
  stime00_rc3_limited_recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 09-stime00-rc3-limited-productive-v1
          fetch-depth: 1

      - name: Validate governed recovery request
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('execution/09/stime00-rc3-limited-v1/RUN_REQUEST.json'))
          assert p['enabled'] is True
          assert p['releaseEvent']=='JBLR-EVT-00000-20260826-ACCEPT-08-STIME00-RC3-QA-AND-RELEASE-09-001'
          assert p['recoveryEvent']=='JBLR-EVT-00000-20260826-ACCEPT-09-INCOMPLETE-MATERIALIZATION-RECOVERY-001'
          assert p['scopeNewTemp']==261 and p['scopeNewOfficialReuse']==562
          assert p['historicalReviewQueue']==14 and p['inheritedEvidence']==1405
          assert p['doNotRerunAll3033'] is True
          assert p['hardGateAPolicy']=='2210_OF_2210_NATIONAL_IDS_UNCHANGED'
          assert p['extensionGateB']=='823_OF_823_AUDITABLE_TERMINAL_IDENTITY_STATE'
          assert p['boundedInputTarSha256']=='3813af25163ef34c970bdca192393237086f915793cc5a9d026407b407aabb57'
          assert p['noFuzzy'] is True and p['noParentIdInheritance'] is True
          assert p['noRankCollapse'] is True and p['noHybridCollapse'] is True
          assert p['sourceFailureNotFound'] is False
          assert p['neonWrites']==0 and p['databaseWrites']==0
          assert p['mutateRC2'] is False and p['finalClose'] is False
          assert p['dispatchAttempt']==3
          PY

      - name: Reconstruct bounded inputs from persisted recovery archive
        run: |
          set -euo pipefail
          ROOT=execution/09/stime00-rc3-limited-v1
          SRC="$ROOT/recovery_inputs"
          OUT="$ROOT/inputs"
          TMP="$RUNNER_TEMP/stime00_recovery_inputs.tar.gz"
          rm -rf "$OUT"; mkdir -p "$OUT" "$RUNNER_TEMP/recovery_parts"
          : > "$TMP"
          declare -A H
          H[00]=33fcdcf511fffe18085b4190da2476b55f956ba2a94b9316286cb2a469ab4ebb
          H[01]=93e269ba917fa669683c863d2a90196c4091d2382d78fd1eeb9e45699de6bb5e
          H[02]=c7d872f9d7e95abc56e63bfa5615d13fa84f615cbc698928128dc7e51969a25d
          H[03]=dcde537244431262eee27e41c35aa4d217568c261e08a7c8c0ed0976af9ce782
          for i in 00 01 02 03; do
            P="$RUNNER_TEMP/recovery_parts/part${i}"
            base64 -d "$SRC/inputs.tar.gz.part${i}.b64" > "$P"
            echo "${H[$i]}  $P" | sha256sum -c -
            cat "$P" >> "$TMP"
          done
          echo "3813af25163ef34c970bdca192393237086f915793cc5a9d026407b407aabb57  $TMP" | sha256sum -c -
          test "$(stat -c %s "$TMP")" = "129424"
          tar -xzf "$TMP" -C "$OUT"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('execution/09/stime00-rc3-limited-v1')
          m=json.load(open(root/'recovery_inputs/RECOVERY_INPUTS_MANIFEST.json'))
          assert m['recoveryEvent']=='JBLR-EVT-00000-20260826-ACCEPT-09-INCOMPLETE-MATERIALIZATION-RECOVERY-001'
          assert m['canonicalRc3']['sha256']=='d45b09e8b57dc403d675f6cada9bd4d65b7411fa57063fd7c90df286ed3b3c71'
          assert m['historicalStime00']['rows']==2210
          assert m['historicalStime00']['uniqueTaxonWorkKeys']==2210
          assert m['historicalStime00']['twkIntersectionWithRc3Inherited']==2210
          assert m['historicalStime00']['missingTaxonWorkKeys']==0
          assert m['historicalStime00']['riojaOrderMismatches']==0
          assert m['historicalStime00']['identityHubKeyMismatches']==0
          assert m['historicalStime00']['integrationIdChanges']==0
          for name,spec in m['boundedInputs'].items():
              p=root/'inputs'/name
              assert p.exists(), name
              data=p.read_bytes()
              assert len(data)==spec['bytes'], (name,len(data),spec['bytes'])
              assert hashlib.sha256(data).hexdigest()==spec['sha256'], name
              with p.open(encoding='utf-8') as f:
                  rows=sum(1 for line in f if line.strip())
              assert rows==spec['rows'], (name,rows,spec['rows'])
          assert sum(x['rows'] for x in m['boundedInputs'].values())==2242
          PY

      - name: Download current official EIDOS
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 --max-time 1800 \
            -o "$RUNNER_TEMP/eidos.ttl" https://datos.iepnb.es/datasets/eidos.ttl
          test -s "$RUNNER_TEMP/eidos.ttl"
          sha256sum "$RUNNER_TEMP/eidos.ttl"

      - name: Execute limited productive reconciliation
        run: |
          set -euo pipefail
          ROOT=execution/09/stime00-rc3-limited-v1
          OUT="$ROOT/runs/STIME00_RC3_LIMITED_RECOVERY_20260826_001"
          rm -rf "$OUT"; mkdir -p "$OUT"
          python "$ROOT/src/productive_stime00_rc3.py" \
            --inputs "$ROOT/inputs" \
            --final309 "execution/06/v17/synonym-system-309/runs/FINAL_CONSOLIDATED_309_V17/CONSOLIDATED_309.jsonl" \
            --eidos "$RUNNER_TEMP/eidos.ttl" \
            --out "$OUT" \
            --release-event "JBLR-EVT-00000-20260826-ACCEPT-08-STIME00-RC3-QA-AND-RELEASE-09-001"

      - name: Verify gates and enrich terminal QA receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('execution/09/stime00-rc3-limited-v1')
          out=root/'runs/STIME00_RC3_LIMITED_RECOVERY_20260826_001'
          m=json.load(open(root/'recovery_inputs/RECOVERY_INPUTS_MANIFEST.json'))
          q=json.load(open(out/'QA_FINAL.json'))
          r=json.load(open(out/'RUN_RECEIPT.json'))
          counts=json.load(open(out/'FINAL_COUNTS.json'))
          assert q['pass'] is True
          assert all(q[x] is True for x in [
              'newTempProcessed','newOfficialAudited','extension823Accounted',
              'historical14Accounted','inheritedEvidence1405Accounted',
              'allExtensionStatesTerminalAllowed','hardGateAReusedNotRerun',
              'doNotRerunAll3033'])
          assert q['neonWrites']==0 and q['databaseWrites']==0 and q['rc2Mutation']==0
          assert q['stime00FinalClose'] is False
          assert r['scope']=={'newTemp':261,'newOfficialReuseAudit':562,'extensionTotal':823,'historicalReviewQueue':14,'inheritedEvidence':1405}
          assert r['guards']['hardGateAReprovedInThisRun'] is False
          assert r['guards']['doNotRerunAll3033'] is True
          assert r['guards']['sourceFailureNotFound'] is False
          assert r['guards']['noFuzzy'] is True
          assert r['guards']['noParentIdInheritance'] is True
          assert r['guards']['noRankCollapse'] is True
          assert r['guards']['noHybridCollapse'] is True
          assert r['guards']['neonWrites']==0 and r['guards']['databaseWrites']==0
          assert r['guards']['mutateRC2'] is False and r['guards']['stime00FinalClose'] is False
          assert sum(r['counts']['extension823'].values())==823
          assert sum(r['counts']['newTemp261'].values())==261
          assert sum(r['counts']['newOfficial562'].values())==562
          assert sum(r['counts']['historical14'].values())==14
          assert sum(r['counts']['inheritedEvidence1405'].values())==1405
          assert m['historicalStime00']['rows']==2210 and m['historicalStime00']['uniqueTaxonWorkKeys']==2210
          assert m['historicalStime00']['twkIntersectionWithRc3Inherited']==2210
          assert m['historicalStime00']['missingTaxonWorkKeys']==0
          assert m['historicalStime00']['integrationIdChanges']==0
          gate={
            'hardGateA':{
              'state':'PASS_PRESERVED',
              'required':'2210_OF_2210_NATIONAL_IDS_UNCHANGED',
              'historicalRows':2210,
              'uniqueTaxonWorkKeys':2210,
              'twkIntersectionWithRc3Inherited':2210,
              'missingTaxonWorkKeys':0,
              'riojaOrderMismatches':0,
              'identityHubKeyMismatches':0,
              'integrationIdChanges':0,
              'productiveHistoricalRerun':False,
              'historicalMutationBy09':0,
              'evidenceSource':'JBLR-EVT-08-20260826-STIME00-RC3-QA-001 + persisted recovery manifest'
            },
            'extensionGateB':{
              'state':'PASS',
              'required':'823_OF_823_AUDITABLE_TERMINAL_IDENTITY_STATE',
              'accounted':sum(r['counts']['extension823'].values()),
              'newOfficial':sum(r['counts']['newOfficial562'].values()),
              'newTemp':sum(r['counts']['newTemp261'].values())
            },
            'boundedScope':{'newTemp':261,'newOfficial':562,'inheritedEvidence':1405,'historicalQueue':14},
            'doNotRerunAll3033':True,
            'neonWrites':0,'databaseWrites':0,'rc2Mutation':0,'stime00FinalClose':False
          }
          (out/'GATE_VERIFICATION.json').write_text(json.dumps(gate,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          q['recoveryEvent']='JBLR-EVT-00000-20260826-ACCEPT-09-INCOMPLETE-MATERIALIZATION-RECOVERY-001'
          q['hardGateA2210of2210Verified']=True
          q['extensionGateB823of823Verified']=True
          q['boundedRecoveryInputsVerified']=True
          q['terminalRecoveryQA']='PASS'
          r['recoveryEvent']='JBLR-EVT-00000-20260826-ACCEPT-09-INCOMPLETE-MATERIALIZATION-RECOVERY-001'
          r['githubRunId']=os.environ.get('GITHUB_RUN_ID')
          r['boundedInputArchiveSha256']='3813af25163ef34c970bdca192393237086f915793cc5a9d026407b407aabb57'
          r['hardGateA2210of2210']='PASS_PRESERVED'
          r['extensionGateB823of823']='PASS'
          r['canonicalResultState']='EVIDENCE_PERSISTED_PENDING_EVENT_BUS_AND_00000_ACCEPTANCE'
          (out/'QA_FINAL.json').write_text(json.dumps(q,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          (out/'RUN_RECEIPT.json').write_text(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY

      - name: Persist terminal recovery evidence
        run: |
          set -euo pipefail
          ROOT=execution/09/stime00-rc3-limited-v1
          OUT="$ROOT/runs/STIME00_RC3_LIMITED_RECOVERY_20260826_001"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('execution/09/stime00-rc3-limited-v1')
          out=root/'runs/STIME00_RC3_LIMITED_RECOVERY_20260826_001'
          counts=json.load(open(out/'FINAL_COUNTS.json'))
          state={
            'state':'COMPLETE_EVIDENCE_PERSISTED_PENDING_EVENT_BUS_READBACK_AND_00000_ACCEPTANCE',
            'githubRunId':os.environ.get('GITHUB_RUN_ID'),
            'releaseEvent':'JBLR-EVT-00000-20260826-ACCEPT-08-STIME00-RC3-QA-AND-RELEASE-09-001',
            'recoveryEvent':'JBLR-EVT-00000-20260826-ACCEPT-09-INCOMPLETE-MATERIALIZATION-RECOVERY-001',
            'hardGateA':'2210_OF_2210_PASS_PRESERVED',
            'extensionGateB':'823_OF_823_PASS',
            'counts':counts,
            'stime00FinalClose':False,
            'neonWrites':0,'databaseWrites':0,'rc2Mutation':0
          }
          (root/'TERMINAL_STATE.json').write_text(json.dumps(state,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin 09-stime00-rc3-limited-productive-v1
          git add "$OUT" "$ROOT/TERMINAL_STATE.json"
          git commit -m "evidence(09): complete STIME00 RC3 limited recovery ${GITHUB_RUN_ID}"
          git push origin HEAD:09-stime00-rc3-limited-productive-v1
