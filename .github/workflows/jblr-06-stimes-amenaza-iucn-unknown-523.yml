name: JBLR STIMES AMENAZA IUCN UNKNOWN 523 FRESH

on:
  workflow_dispatch:
  push:
    branches:
      - 06-stimes-banco-semillas
    paths:
      - .github/workflows/jblr-06-stimes-amenaza-iucn-unknown-523.yml
      - app/scripts/stimes-amenaza-iucn-unknown-523-fresh.py

permissions:
  contents: write

jobs:
  iucn-unknown-523-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IUCN_API_TOKEN: ${{ secrets.IUCN_API_TOKEN }}
      IUCN_OUT: artifacts/iucn_unknown_523_fresh
      IUCN_WAIT_SECONDS: "0.65"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 06-stimes-banco-semillas

      - name: Verify IUCN secret
        shell: bash
        run: |
          if [ -z "${IUCN_API_TOKEN}" ]; then
            echo "IUCN_API_TOKEN is not configured"
            exit 1
          fi
          echo "IUCN_API_TOKEN is configured"

      - name: Verify IUCN API authentication
        shell: bash
        run: |
          curl --silent --show-error --fail-with-body \
            -H "Authorization: ${IUCN_API_TOKEN}" \
            -H "Accept: application/json" \
            "https://api.iucnredlist.org/api/v4/countries/" \
            -o /tmp/iucn-auth-check.json
          python3 - <<'PY'
          import json
          with open('/tmp/iucn-auth-check.json', encoding='utf-8') as f:
              data=json.load(f)
          if not isinstance(data, dict):
              raise SystemExit('Unexpected IUCN authentication response')
          print('IUCN API authentication verified')
          PY

      - name: Execute fresh IUCN API v4 search
        run: python3 app/scripts/stimes-amenaza-iucn-unknown-523-fresh.py

      - name: Materialize auditable result on branch
        shell: bash
        run: |
          TARGET="evidence/06_stimes/iucn_unknown_523_fresh/latest"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp "$IUCN_OUT/IUCN_UNKNOWN_523_QUEUE_USED.csv" "$TARGET/"
          cp "$IUCN_OUT/IUCN_UNKNOWN_523_RESULTS.csv" "$TARGET/"
          cp "$IUCN_OUT/IUCN_UNKNOWN_523_ISSUES.csv" "$TARGET/"
          cp "$IUCN_OUT/IUCN_UNKNOWN_523_QA.json" "$TARGET/"
          printf '%s\n' "github_run_id=${GITHUB_RUN_ID}" "github_run_attempt=${GITHUB_RUN_ATTEMPT}" "source_commit=${GITHUB_SHA}" > "$TARGET/RUN_METADATA.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          if git diff --cached --quiet; then
            echo "No result change to commit"
          else
            git commit -m "Materialize fresh IUCN UNKNOWN 523 results [skip ci]"
            git push origin HEAD:06-stimes-banco-semillas
          fi

      - name: Upload fresh IUCN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IUCN_UNKNOWN_523_FRESH_v1
          path: artifacts/iucn_unknown_523_fresh/
          if-no-files-found: warn
          retention-days: 30
