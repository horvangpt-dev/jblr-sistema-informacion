[project]
name = "jblr"
version = "0.1.0a0"
description = "JBLR software foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.128.2",
  "pydantic==2.13.4",
  "psycopg[binary]==3.3.4",
  "uvicorn==0.48.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
